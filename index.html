  // ── 좌표 → 캔들 지점 변환 (정밀 자석 스냅) ──
  // 커서 아래 봉 1개만 보던 기존 방식은 꼬리 끝을 노려도 가로로 조금 빗나가면
  // 엉뚱한 봉에 붙었다. 이제 좌우 이웃 봉까지 함께 검사하고, 세로 거리만이 아닌
  // 2차원(가로+세로) 픽셀 거리로 가장 가까운 지점을 고른다.
  // 추세선은 관례상 꼬리(고가·저가)를 잇는 것이므로 고가·저가에 가중 우선권을 준다.
  function ptAt(x, y, useMagnet) {
    if (!barsArr.length) return null;
    const ts = chart.timeScale();
    const logical = ts.coordinateToLogical(x);
    if (logical == null) return null;
    const idx = Math.max(0, Math.min(barsArr.length - 1, Math.round(logical)));
    const bar = barsArr[idx];
    const raw = candles.coordinateToPrice(y);
    if (raw == null) return null;
    if (!useMagnet) return { time: bar.time, idx, price: raw, snapped: false };
    let best = null, bestScore = Infinity;
    const from = Math.max(0, idx - 2), to = Math.min(barsArr.length - 1, idx + 2);
    for (let i = from; i <= to; i++) {
      const b = barsArr[i];
      const bx = ts.timeToCoordinate(b.time);
      if (bx == null) continue;
      const dx = bx - x;
      // 후보: 고가·저가(꼬리)는 가중 0.55로 우선, 시가·종가는 1.0
      const cands = [
        [b.high, 0.55], [b.low, 0.55], [b.open, 1.0], [b.close, 1.0],
      ];
      for (const [p, w] of cands) {
        const cy = candles.priceToCoordinate(p);
        if (cy == null) continue;
        const dist = Math.hypot(dx, cy - y);
        if (dist > SNAP_PX) continue;          // 실제 반경 밖이면 제외
        const score = dist * w;                 // 가중 점수로 꼬리 우선
        if (score < bestScore) {
          bestScore = score;
          best = { time: b.time, idx: i, price: p };
        }
      }
    }
    if (best) return { ...best, snapped: true };
    return { time: bar.time, idx, price: raw, snapped: false };
  }
  const snapAt = (x, y) => ptAt(x, y, magnet);
  function nearestIdx(time) {
    if (!barsArr.length) return 0;
    let lo = 0, hi = barsArr.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (barsArr[m].time < time) lo = m + 1; else hi = m; }
    return lo;
  }

  function trendData(t) {
    const a = t.p1.time <= t.p2.time ? t.p1 : t.p2;
    const b = t.p1.time <= t.p2.time ? t.p2 : t.p1;
    const ai = a.idx ?? nearestIdx(a.time), bi = b.idx ?? nearestIdx(b.time);
    if (!extendMode || bi === ai || !barsArr.length) {
      return [{ time: a.time, value: a.price }, { time: b.time, value: b.price }];
    }
    // 기울기를 유지한 채 마지막 봉을 지나 미래 80봉까지 연장 (기존 20봉 → 4배 확대)
    const slope = (b.price - a.price) / (bi - ai);
    const lastIdx = barsArr.length - 1;
    const step = lastIdx > 0 ? barsArr[lastIdx].time - barsArr[lastIdx - 1].time : 0;
    const EXT = 80;
    const futIdx = lastIdx + (step > 0 ? EXT : 0);
    const end = b.price + slope * (futIdx - bi);
    if (end <= 0 || futIdx <= bi) {
      return [{ time: a.time, value: a.price }, { time: b.time, value: b.price }];
    }
    const endTime = barsArr[lastIdx].time + (step > 0 ? step * EXT : 0);
    return [{ time: a.time, value: a.price }, { time: endTime, value: end }];
  }
  function renderTrend(t) {
    try { t.series.setData(trendData(t)); } catch {}
  }

  function newHorizLine(price) {
    return candles.createPriceLine({
      price, color: "#c084fc", lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid,
      axisLabelVisible: true, title: "내 라인",
    });
  }
  function makeHoriz(price) {
    const item = { price, line: newHorizLine(price) };
    userLines.push(item);
    return item;
  }
  function makeTrend(p1, p2) {
    const s = chart.addLineSeries({
      color: "#c084fc", lineWidth: 2,
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
    });
    const t = { p1, p2, series: s };
    renderTrend(t);
    userTrends.push(t);
    return t;
  }

  function clearPreview() {
    if (previewSeries) { try { chart.removeSeries(previewSeries); } catch {} previewSeries = null; }
    if (typeof hideSnapDot === "function") hideSnapDot();
  }
  function detachUserLines() {
    userLines.forEach(h => { try { candles.removePriceLine(h.line); } catch {} });
    userTrends.forEach(t => { try { chart.removeSeries(t.series); } catch {} });
    userLines = []; userTrends = [];
    pending = null;
    clearPreview();
  }
  function restoreUserLines(key) {
    detachUserLines();
    selected = null;
    const saved = lineStore[storeKeyFor(key)];
    if (saved) {
      (saved.horiz || []).forEach(p => makeHoriz(p));
      (saved.trends || []).forEach(tr => {
        makeTrend(
          { ...tr.p1, idx: nearestIdx(tr.p1.time) },
          { ...tr.p2, idx: nearestIdx(tr.p2.time) }
        );
      });
    }
    drawHandles();
    setDrawHint();
  }
  function clearUserLines() {
    detachUserLines();
    selected = null;
    delete lineStore[storeKeyFor(current.key)];
    persist();
    drawHandles();
    setDrawHint();
  }
  function setDrawHint() {
    const el = $("draw-hint");
    if (drawMode === "trend") el.textContent = pending ? "끝점을 클릭하세요" : "시작점을 클릭하세요";
    else if (drawMode === "horiz") el.textContent = "가격 위치를 클릭하세요";
    else if (userTrends.length || userLines.length) el.textContent = "선 탭=선택(조작점 표시) · 더블탭=삭제 · 빈 곳 탭=선택 해제";
    else el.textContent = "";
  }

  // ── 핸들 오버레이 (● 끝점 회전/길이, ■ 가운데 이동, 수평선 이동) ──
  // 성능: DOM을 매 프레임 다시 만들지 않고, 만들어 둔 핸들의 좌표만 갱신한다.
  const svg = $("handles");
  const chartEl = $("chart");
  let handleRefs = [];       // {el, kind, trend?, which?, item?}
  let handlesRaf = 0;

  // 스냅 지점 표시 링: 그리는 중·드래그 중 선이 정확히 어느 지점(꼬리·몸통)에
  // 붙을지 실시간으로 보여줘 손을 떼기 전에 정밀하게 조준할 수 있게 한다.
  const snapDot = document.createElementNS(SVGNS, "circle");
  snapDot.setAttribute("class", "snapdot");
  snapDot.setAttribute("r", 5);
  snapDot.style.display = "none";
  svg.appendChild(snapDot);
  function showSnapDot(pt) {
    if (!pt || !pt.snapped) { hideSnapDot(); return; }
    const sx = chart.timeScale().timeToCoordinate(pt.time);
    const sy = candles.priceToCoordinate(pt.price);
    if (sx == null || sy == null) { hideSnapDot(); return; }
    snapDot.setAttribute("cx", sx);
    snapDot.setAttribute("cy", sy);
    snapDot.style.display = "";
  }
  function hideSnapDot() { snapDot.style.display = "none"; }

  function startDrag(ev, d) {
    ev.preventDefault(); ev.stopPropagation();
    dragging = d;
    chart.applyOptions({ handleScroll: false, handleScale: false });
    window.addEventListener("pointermove", onDragMove);
    $("draw-hint").textContent =
      d.type === "mid" ? "선 전체를 이동 중… 놓으면 고정됩니다" :
      d.type === "horiz" ? "수평선을 이동 중…" :
      "반대쪽 점을 축으로 회전·길이 조절 중…";
  }
  function deleteTrend(t) {
    try { chart.removeSeries(t.series); } catch {}
    userTrends = userTrends.filter(x => x !== t);
    if (selected && selected.type === "trend" && selected.ref === t) selected = null;
    saveStore(); rebuildHandles(); setDrawHint();
  }
  function deleteHoriz(h) {
    try { candles.removePriceLine(h.line); } catch {}
    userLines = userLines.filter(x => x !== h);
    if (selected && selected.type === "horiz" && selected.ref === h) selected = null;
    saveStore(); rebuildHandles(); setDrawHint();
  }
  function selectTrend(t) { selected = { type: "trend", ref: t }; rebuildHandles(); }
  function selectHoriz(h) { selected = { type: "horiz", ref: h }; rebuildHandles(); }
  function deselectAll() {
    if (!selected) return;
    selected = null;
    rebuildHandles();
  }

  function mkEl(tag, cls) {
    const e = document.createElementNS(SVGNS, tag);
    e.setAttribute("class", cls);
    return e;
  }

  // 선이 추가·삭제·선택될 때만 호출 (DOM 재구성)
  function rebuildHandles() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.appendChild(snapDot);   // 스냅 링은 항상 유지 (제거 후 재부착)
    handleRefs = [];

    for (const t of userTrends) {
      const isSel = selected && selected.type === "trend" && selected.ref === t;
      // 선 본체: 항상 존재하는 투명 히트라인 — 탭하면 선택, 더블클릭하면 삭제, 끌면 이동
      const hit = mkEl("line", "hitline");
      hit.addEventListener("pointerdown", ev => {
        if (!isSel) { selectTrend(t); return; }   // 미선택 상태에서는 먼저 선택만 (핸들 노출)
        const rr = chartEl.getBoundingClientRect();
        const pt = ptAt(ev.clientX - rr.left, ev.clientY - rr.top, false);
        if (!pt) return;
        startDrag(ev, { type: "mid", trend: t,
          off1: { idx: (t.p1.idx ?? nearestIdx(t.p1.time)) - pt.idx, price: t.p1.price - pt.price },
          off2: { idx: (t.p2.idx ?? nearestIdx(t.p2.time)) - pt.idx, price: t.p2.price - pt.price } });
      });
      hit.addEventListener("dblclick", ev => { ev.stopPropagation(); deleteTrend(t); });
      svg.appendChild(hit);
      handleRefs.push({ el: hit, kind: "line", trend: t });

      // 조작 핸들(끝점 ●, 가운데 ■)은 선택된 선에서만 렌더 — 평소엔 차트를 가리지 않음
      if (!isSel) continue;
      for (const which of ["p1", "p2"]) {
        const c = mkEl("circle", "handle");
        c.setAttribute("r", 6);
        c.addEventListener("pointerdown", ev => startDrag(ev, { type: "end", trend: t, which }));
        c.addEventListener("dblclick", ev => { ev.stopPropagation(); deleteTrend(t); });
        svg.appendChild(c);
        handleRefs.push({ el: c, kind: "end", trend: t, which });
      }
      const r = mkEl("rect", "handle");
      r.setAttribute("width", 10); r.setAttribute("height", 10);
      r.addEventListener("pointerdown", ev => {
        const rr = chartEl.getBoundingClientRect();
        const pt = ptAt(ev.clientX - rr.left, ev.clientY - rr.top, false);
        if (!pt) return;
        startDrag(ev, { type: "mid", trend: t,
          off1: { idx: (t.p1.idx ?? nearestIdx(t.p1.time)) - pt.idx, price: t.p1.price - pt.price },
          off2: { idx: (t.p2.idx ?? nearestIdx(t.p2.time)) - pt.idx, price: t.p2.price - pt.price } });
      });
      r.addEventListener("dblclick", ev => { ev.stopPropagation(); deleteTrend(t); });
      svg.appendChild(r);
      handleRefs.push({ el: r, kind: "mid", trend: t });
    }

    for (const h of userLines) {
      const isSel = selected && selected.type === "horiz" && selected.ref === h;
      const r = mkEl("rect", isSel ? "handle" : "handle handle-dim");
      r.setAttribute("width", isSel ? 14 : 10);
      r.setAttribute("height", isSel ? 10 : 7);
      r.setAttribute("rx", 2);
      r.addEventListener("pointerdown", ev => {
        if (!isSel) { selectHoriz(h); return; }
        startDrag(ev, { type: "horiz", item: h });
      });
      r.addEventListener("dblclick", ev => { ev.stopPropagation(); deleteHoriz(h); });
      svg.appendChild(r);
      handleRefs.push({ el: r, kind: "horiz", item: h, isSel });
    }
    positionHandles();
  }

  // 위치만 갱신 (DOM 생성 없음)
  function positionHandles() {
    if (!handleRefs.length) return;
    const ts = chart.timeScale();
    const w = chartEl.clientWidth;
    for (const ref of handleRefs) {
      let x = null, y = null;
      if (ref.kind === "line") {
        const t = ref.trend;
        const d = trendData(t);
        const x1 = ts.timeToCoordinate(d[0].time), y1 = candles.priceToCoordinate(d[0].value);
        const x2 = ts.timeToCoordinate(d[1].time), y2 = candles.priceToCoordinate(d[1].value);
        if (x1 != null && y1 != null && x2 != null && y2 != null) {
          ref.el.setAttribute("x1", x1); ref.el.setAttribute("y1", y1);
          ref.el.setAttribute("x2", x2); ref.el.setAttribute("y2", y2);
          x = x1; y = y1;
        }
      } else if (ref.kind === "end") {
        const p = ref.trend[ref.which];
        x = ts.timeToCoordinate(p.time); y = candles.priceToCoordinate(p.price);
        if (x != null && y != null) { ref.el.setAttribute("cx", x); ref.el.setAttribute("cy", y); }
      } else if (ref.kind === "mid") {
        const t = ref.trend;
        const x1 = ts.timeToCoordinate(t.p1.time), y1 = candles.priceToCoordinate(t.p1.price);
        const x2 = ts.timeToCoordinate(t.p2.time), y2 = candles.priceToCoordinate(t.p2.price);
        if (x1 != null && y1 != null && x2 != null && y2 != null) {
          x = (x1 + x2) / 2; y = (y1 + y2) / 2;
          ref.el.setAttribute("x", x - 5); ref.el.setAttribute("y", y - 5);
        }
      } else {
        y = candles.priceToCoordinate(ref.item.price);
        const hh = ref.isSel ? 5 : 3.5;
        if (y != null) { x = w - 80; ref.el.setAttribute("x", x); ref.el.setAttribute("y", y - hh); }
      }
      ref.el.style.display = (x == null || y == null) ? "none" : "";
    }
  }

  // 프레임당 한 번만 갱신되도록 병합
  function scheduleHandles() {
    if (handlesRaf) return;
    handlesRaf = requestAnimationFrame(() => { handlesRaf = 0; positionHandles(); });
  }
  function drawHandles() { rebuildHandles(); }   // 기존 호출부 호환

  // ── 드래그 처리 (드래그 중에만 리스너 활성, 프레임당 1회 반영) ──
  let dragPos = null, dragRaf = 0;
  function applyDrag() {
    dragRaf = 0;
    if (!dragging || !dragPos) return;
    const { x, y } = dragPos;
    if (dragging.type === "end") {
      const pt = snapAt(x, y);
      if (!pt) return;
      showSnapDot(pt);
      const cur = dragging.trend[dragging.which];
      if (cur.time === pt.time && cur.price === pt.price) return;  // 변화 없으면 건너뜀
      dragging.trend[dragging.which] = pt;
      renderTrend(dragging.trend);
    } else if (dragging.type === "mid") {
      const pt = ptAt(x, y, false);
      if (!pt) return;
      const t = dragging.trend, n = barsArr.length - 1;
      for (const [k, off] of [["p1", dragging.off1], ["p2", dragging.off2]]) {
        const idx = Math.max(0, Math.min(n, pt.idx + off.idx));
        t[k] = { idx, time: barsArr[idx].time, price: pt.price + off.price };
      }
      renderTrend(t);
    } else if (dragging.type === "horiz") {
      const p = candles.coordinateToPrice(y);
      if (p == null) return;
      dragging.item.price = p;
      // 선을 지웠다 다시 만들지 않고 가격만 갱신 (부하의 주원인이었음)
      try { dragging.item.line.applyOptions({ price: p }); } catch {}
    }
    positionHandles();
  }
  function onDragMove(ev) {
    if (!dragging) return;
    ev.preventDefault();
    const r = chartEl.getBoundingClientRect();
    dragPos = { x: ev.clientX - r.left, y: ev.clientY - r.top };
    if (!dragRaf) dragRaf = requestAnimationFrame(applyDrag);
  }
  window.addEventListener("pointerup", () => {
    if (!dragging) return;
    window.removeEventListener("pointermove", onDragMove);
    if (dragRaf) { cancelAnimationFrame(dragRaf); dragRaf = 0; }
    dragging = null; dragPos = null;
    hideSnapDot();
    chart.applyOptions({ handleScroll: true, handleScale: true });
    saveStore();
    setDrawHint();
  });

  // 차트 이동·확대 시 핸들 위치 동기화
  chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
    scheduleHandles();
    scheduleSaveView();   // 확대·이동이 멈추면 현재 화면을 기억
  });

  // ── 그리는 중 미리보기 (프레임당 1회) ──
  let previewRaf = 0, previewPt = null;
  chart.subscribeCrosshairMove(param => {
    if (!drawMode || !param.point) { if (!dragging) hideSnapDot(); return; }
    const pt = snapAt(param.point.x, param.point.y);
    // 첫 클릭 전에도 스냅 링을 보여줘 시작점부터 정확히 조준할 수 있게 한다
    showSnapDot(pt);
    if (drawMode !== "trend" || !pending) return;
    if (!pt || pt.time === pending.time) return;
    previewPt = pt;
    if (previewRaf) return;
    previewRaf = requestAnimationFrame(() => {
      previewRaf = 0;
      if (!pending || !previewPt) return;
      if (!previewSeries) {
        previewSeries = chart.addLineSeries({
          color: "rgba(192,132,252,.6)", lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dotted,
          priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
        });
      }
      const pts = [pending, previewPt].sort((a, b) => a.time - b.time)
        .map(p => ({ time: p.time, value: p.price }));
      try { previewSeries.setData(pts); } catch {}
    });
  });

  chart.subscribeClick(param => {
    if (!drawMode || !param.point) return;
    const pt = snapAt(param.point.x, param.point.y);
    if (!pt) return;

    if (drawMode === "horiz") {
      const item = makeHoriz(pt.price);
      hideSnapDot();
      saveStore();
      selected = { type: "horiz", ref: item };   // 그린 즉시 선택 상태로 → 핸들 바로 노출
      rebuildHandles();
      drawMode = null;          // 하나 그리면 자동으로 모드 해제 (실수로 계속 생기는 것 방지)
      applyDrawMode();
      return;
    }
    if (!pending) { pending = pt; setDrawHint(); return; }
    if (pt.time === pending.time) return;   // 같은 봉 두 번 클릭 방지

    const t = makeTrend(pending, pt);
    pending = null;
    clearPreview();
    saveStore();
    selected = { type: "trend", ref: t };    // 그린 즉시 선택 상태로 → 핸들 바로 노출
    rebuildHandles();
    drawMode = null;            // 하나 그리면 자동으로 모드 해제
    applyDrawMode();
  });

  // 그리기 모드가 아닐 때 차트 빈 곳을 클릭하면 선택을 해제 (핸들 숨김)
  chart.subscribeClick(param => {
    if (drawMode) return;   // 그리기 중에는 위 로직이 처리
    deselectAll();
  });

  // ── AI 해설 ──
  const sep3 = document.createElement("div");
  sep3.className = "sep";
  sep3.style.marginLeft = "auto";
  tools.appendChild(sep3);
  const btnAI = document.createElement("button");
  btnAI.className = "toggle on-ai";
  btnAI.textContent = "AI 해설";
  btnAI.addEventListener("click", showCommentary);
  tools.appendChild(btnAI);

  function fmtSlope(t) {
    return t.slope > 0 ? "우상향" : "우하향";
  }
  function buildLocalCommentary() {
    if (!lastAnalysis) return "분석 데이터가 아직 없습니다. 차트가 로드된 뒤 다시 눌러주세요.";
    const { price, sup, res, trends, bars } = lastAnalysis;
    const out = [];
    out.push(`현재 ${current.label} 기준 BTC 가격은 ${fmtPrice(price)} 달러입니다.`);
    if (bars.length >= 10) {
      const ago = bars[Math.max(0, bars.length - 10)].close;
      const chg = ((price - ago) / ago * 100).toFixed(1);
      out.push(`최근 10개 봉 동안 ${chg >= 0 ? "+" : ""}${chg}% ${chg >= 0 ? "상승" : "하락"}했습니다.`);
    }
    if (sup) {
      const d = ((price - sup.price) / price * 100).toFixed(1);
      out.push(`가장 가까운 지지선은 ${fmtPrice(sup.price)} (현재가 대비 -${d}%, ${sup.touches}회 확인)으로, 이 구간이 지켜지는지가 단기 방어선입니다.`);
    }
    if (res) {
      const d = ((res.price - price) / price * 100).toFixed(1);
      out.push(`가장 가까운 저항선은 ${fmtPrice(res.price)} (+${d}%, ${res.touches}회 확인)이며, 돌파 시 다음 구간까지 열릴 수 있습니다.`);
    }
    for (const t of trends) {
      out.push(`${t.kind}은 ${fmtSlope(t)} 기울기로 ${t.touches}개 스윙 포인트를 지지받고 있습니다.`);
    }
    if (sup && res) {
      const room = ((res.price - price) / (price - sup.price)).toFixed(1);
      out.push(`현재 위치는 지지-저항 사이 구간으로, 위쪽 여유 공간이 아래쪽의 약 ${room}배입니다.`);
    }
    out.push("※ 자동 계산된 참고 자료이며 투자 판단의 책임은 본인에게 있습니다.");
    return out.join(" ");
  }

  async function showCommentary() {
    const panel = $("ai-panel");
    const body = $("ai-body");
    panel.style.display = "block";
    body.className = "";
    body.textContent = "해설을 생성하는 중…";
    const local = buildLocalCommentary();
    // Claude API 사용 가능 환경(Claude 아티팩트)에서는 AI 해설, 아니면 규칙 기반 요약
    try {
      const ctx = lastAnalysis ? {
        시간봉: current.label,
        현재가: lastAnalysis.price,
        지지선: lastAnalysis.sup,
        저항선: lastAnalysis.res,
        추세선: lastAnalysis.trends,
        최근봉: lastAnalysis.bars.map(b => ({ t: b.time, c: b.close })),
      } : null;
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",

  function klineToBar(k) {
    return {
      time: Math.floor(k[0] / 1000),
      open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5],
    };
  }
  function aggregateYearly(bars) {
    const byYear = new Map();
    for (const b of bars) {
      const y = new Date(b.time * 1000).getUTCFullYear();
      const cur = byYear.get(y);
      if (!cur) {
        byYear.set(y, { time: Math.floor(Date.UTC(y, 0, 1) / 1000),
          open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume, year: y });
      } else {
        cur.high = Math.max(cur.high, b.high);
        cur.low = Math.min(cur.low, b.low);
        cur.close = b.close;
        cur.volume += b.volume;
      }
    }
    return [...byYear.values()].sort((a, b) => a.time - b.time);
  }
  function volColor(bar) {
    return bar.close >= bar.open ? "rgba(239,68,68,.35)" : "rgba(59,130,246,.35)";
  }
  function applyBars(bars) {
    candles.setData(bars.map(({ time, open, high, low, close }) => ({ time, open, high, low, close })));
    volume.setData(bars.map(b => ({ time: b.time, value: b.volume, color: volColor(b) })));
    const N = 20, ma = [];
    let sum = 0;
    bars.forEach((b, i) => {
      sum += b.volume;
      if (i >= N) sum -= bars[i - N].volume;
      ma.push(i >= N - 1 ? { time: b.time, value: sum / N } : { time: b.time });
    });
    volMA.setData(ma);
  }

  async function fetchKimp() {

  async function fetchFunding() {

    const rate = parseFloat(d.lastFundingRate);
    if (!Number.isFinite(rate)) return null;
    const mins = d.nextFundingTime ? Math.max(0, Math.round((d.nextFundingTime - Date.now()) / 60000)) : null;

  // ATR(14) — 하루(한 봉) 평균 변동폭. 손절 폭을 감이 아니라 숫자로 잡는 데 쓴다.
  function calcATR(bars, period = 14) {
    if (bars.length < period + 1) return null;
    let sum = 0;
    for (let i = 1; i <= period; i++) {
      const b = bars[i], pc = bars[i - 1].close;
      sum += Math.max(b.high - b.low, Math.abs(b.high - pc), Math.abs(b.low - pc));
    }
    let atr = sum / period;
    for (let i = period + 1; i < bars.length; i++) {
      const b = bars[i], pc = bars[i - 1].close;
      const tr = Math.max(b.high - b.low, Math.abs(b.high - pc), Math.abs(b.low - pc));
      atr = (atr * (period - 1) + tr) / period;
    }
    return atr;
  }

  // 지금 봉의 거래량이 최근 20봉 평균의 몇 배인지
  function calcVolRatio(bars, n = 20) {
    if (bars.length < n + 1) return null;
    const prev = bars.slice(-n - 1, -1);
    const avg = prev.reduce((a, b) => a + b.volume, 0) / n;
    if (!avg) return null;
    return bars[bars.length - 1].volume / avg;
  }

  function updateLocalStats(bars) {
    if (!bars || !bars.length) return;
    const atr = calcATR(bars);
    mkt.atr = atr ? { abs: atr, pct: (atr / bars[bars.length - 1].close) * 100 } : null;
    mkt.volX = calcVolRatio(bars);

  }

  //  종합 정리 — 흩어져 있는 지표를 한 화면에서 같은 잣대로 읽어 준다.
  //  각 항목이 위/아래 어느 쪽을 가리키는지 방향과 가중치를 매겨 합산한다.

  //  지표가 서로 다른 말을 하면 그 사실 자체를 혼조로 보여 주는 것이 목적이다.
  // ══════════════════════════════════════════════════════════
  function lastVal(arr) { return arr.length ? arr[arr.length - 1].value : null; }

  function digestSignals() {
    const bars = barsArr;
    if (!bars || bars.length < 30) return null;
    const price = bars[bars.length - 1].close;
    const sig = [];
    const add = (nm, dir, w, tx) => sig.push({ nm, dir, w, tx });
    const pct = (a, b) => ((a - b) / b) * 100;

    // ① 추세 — 이평선 배열
    const e21 = lastVal(calcEMA(bars, 21));
    const e50 = lastVal(calcEMA(bars, 50));
    const e200 = bars.length >= 200 ? lastVal(calcEMA(bars, 200)) : null;
    if (e21 && e50) {
      const above = price > e21, cross = e21 > e50;
      const longTxt = e200 ? ` 장기 200 EMA(${fmtPrice(e200)})보다 ${price > e200 ? "위" : "아래"}입니다.` : "";
      if (above && cross)
        add("추세", 1, 2, `가격이 단기선 위에 있고 단기선(${fmtPrice(e21)})이 중기선(${fmtPrice(e50)})보다 위입니다. 오르는 흐름이 유지되는 배열입니다.${longTxt}`);
      else if (!above && !cross)
        add("추세", -1, 2, `가격이 단기선 아래에 있고 단기선(${fmtPrice(e21)})이 중기선(${fmtPrice(e50)})보다 아래입니다. 내리는 흐름이 유지되는 배열입니다.${longTxt}`);
      else
        add("추세", 0, 2, `가격과 이동평균선이 엇갈려 있습니다(단기 ${fmtPrice(e21)}, 중기 ${fmtPrice(e50)}). 방향이 아직 정해지지 않은 구간입니다.${longTxt}`);
    }

    // ② 지지·저항 위치 — 위아래 중 어느 쪽이 더 가까운가
    if (lastAnalysis && (lastAnalysis.sup || lastAnalysis.res)) {
      const r = lastAnalysis.res, sp = lastAnalysis.sup;
      const dr = r ? pct(r.price, price) : null;
      const ds = sp ? pct(price, sp.price) : null;
      if (dr != null && ds != null) {
        const dir = ds < dr ? 1 : -1;
        add("자리", dir, 2,
          `아래 지지선 ${fmtPrice(sp.price)}까지 ${ds.toFixed(1)}%, 위 저항선 ${fmtPrice(r.price)}까지 ${dr.toFixed(1)}% 남았습니다. `
          + (dir > 0 ? "지지선에 더 가까워 아래쪽 받침이 가까운 자리입니다."
                     : "저항선에 더 가까워 위쪽이 막혀 있는 자리입니다."));
      } else if (dr != null) {
        add("자리", -1, 1, `위 저항선 ${fmtPrice(r.price)}까지 ${dr.toFixed(1)}% 남았고, 아래 가까운 지지선은 잡히지 않았습니다.`);
      } else {
        add("자리", 1, 1, `아래 지지선 ${fmtPrice(sp.price)}까지 ${ds.toFixed(1)}% 남았고, 위 가까운 저항선은 잡히지 않았습니다.`);
      }
    }

    // ③ RSI — 켜져 있을 때만 (계산은 언제든 가능하나 사용자가 안 보는 지표는 넣지 않는다)
    if (showRSI && rsiLast != null) {
      const v = rsiLast;
      if (v >= 70) add("RSI", 1, 2, `${v.toFixed(1)}로 과매수 구간입니다. 오르는 힘은 세지만 짧게 보면 과열이라 되밀림이 잦은 자리이기도 합니다.`);
      else if (v >= 50) add("RSI", 1, 2, `${v.toFixed(1)}로 중간선 50 위입니다. 오르는 쪽에 힘이 실려 있습니다.`);
      else if (v > 30) add("RSI", -1, 2, `${v.toFixed(1)}로 중간선 50 아래입니다. 내리는 쪽에 힘이 실려 있습니다.`);
      else add("RSI", -1, 2, `${v.toFixed(1)}로 과매도 구간입니다. 많이 내렸다는 뜻이지 반등이 보장된다는 뜻은 아닙니다.`);

      if (lastRSI && lastRSI.div) {
        const d = lastRSI.div;
        add("다이버전스", d.cls === "bull" ? 1 : -1, 3,
          `${d.label}가 잡혀 있습니다. ${d.desc}. 가격과 힘이 서로 다른 말을 하는 상태로, 흐름이 바뀔 수 있다는 이른 신호입니다. 다만 자주 어긋나므로 이것만 믿으면 안 됩니다.`);
      }
    }

    // ④ 거래량 — 방향이 아니라 "지금 움직임에 힘이 실렸는가"의 신뢰도
    if (mkt.volX != null) {
      const x = mkt.volX;
      add("거래량", 0, 0,
        x >= 1.8 ? `20봉 평균의 ${x.toFixed(1)}배로 손바뀜이 크게 일어나고 있습니다. 지금 나오는 움직임에는 힘이 실려 있습니다.`
        : x <= 0.6 ? `20봉 평균의 ${x.toFixed(1)}배로 한산합니다. 선을 뚫는 움직임이 나와도 힘이 실리지 않은 돌파일 수 있습니다.`
        : `20봉 평균의 ${x.toFixed(1)}배로 평범한 수준입니다.`);
    }

    // ⑤ 선물 쏠림
    if (mkt.funding) {
      const f = mkt.funding.pct;
      if (f >= 0.05) add("펀딩", -1, 1, `${f.toFixed(4)}%로 오를 것에 건 쪽이 과하게 몰려 있습니다. 쏠림이 심하면 작은 하락에도 강제 청산이 연쇄로 터질 수 있습니다.`);
      else if (f <= -0.02) add("펀딩", 1, 1, `${f.toFixed(4)}%로 내릴 것에 건 쪽이 비용을 내고 있습니다. 숏이 몰린 상태에서는 반대로 튀어오르기도 합니다.`);
      else add("펀딩", 0, 1, `${f.toFixed(4)}%로 한쪽 쏠림이 뚜렷하지 않습니다.`);
    }

    // ⑥ 심리
    if (mkt.fng) {
      const v = mkt.fng.value;
      if (v >= 75) add("심리", -1, 1, `공포탐욕지수 ${v}(${mkt.fng.label})로 시장이 들떠 있습니다. 모두가 낙관할 때가 위험이 큰 구간이기도 합니다.`);
      else if (v <= 25) add("심리", 1, 1, `공포탐욕지수 ${v}(${mkt.fng.label})로 시장이 위축돼 있습니다. 다만 공포가 극단으로 가도 가격은 더 내릴 수 있습니다.`);
      else add("심리", 0, 1, `공포탐욕지수 ${v}(${mkt.fng.label})로 중립에 가깝습니다.`);
    }

    // ⑦ 국내 프리미엄
    if (mkt.kimp) {
      const k = mkt.kimp.pct;
      if (k >= 3) add("김프", -1, 1, `${k.toFixed(2)}%로 국내가 해외보다 꽤 비쌉니다. 국내 매수세가 과열됐다는 뜻이고, 지금 국내에서 사면 그만큼 비싸게 사는 셈입니다.`);
      else if (k <= -0.5) add("김프", 1, 1, `${k.toFixed(2)}%로 국내가 해외보다 쌉니다. 국내 관심이 식어 있는 상태입니다.`);
      else add("김프", 0, 1, `${k.toFixed(2)}%로 해외와 큰 차이가 없습니다.`);
    }

    const score = sig.reduce((a, x) => a + x.dir * x.w, 0);
    const maxW = sig.reduce((a, x) => a + x.w, 0);
    return { sig, score, maxW, price, e21, e50 };
  }

  function digestVerdict(score) {
    if (score >= 5) return ["bull", "강세 우위", "지표 대부분이 위쪽을 가리키고 있습니다"];
    if (score >= 2) return ["bull", "약한 강세", "위쪽을 가리키는 지표가 조금 더 많습니다"];
    if (score > -2) return ["flat", "혼조", "지표들이 서로 다른 말을 하고 있습니다"];
    if (score > -5) return ["bear", "약한 약세", "아래쪽을 가리키는 지표가 조금 더 많습니다"];
    return ["bear", "약세 우위", "지표 대부분이 아래쪽을 가리키고 있습니다"];
  }

  function showDigest() {
    const panel = $("ai-panel");
    const body = $("ai-body");
    panel.style.display = "block";
    panel.scrollTop = 0;
    $("ai-src").textContent = `종합 정리 · ${coin.name} ${current.label}`;

    const d = digestSignals();
    if (!d) {
      body.className = "";
      body.textContent = "아직 분석할 캔들이 충분하지 않습니다. 차트가 불러와진 뒤 다시 눌러주세요.";
      return;
    }
    const [cls, title, sub] = digestVerdict(d.score);
    const esc = t => String(t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

    let h = `<span class="vd ${cls}">${title}</span>`;
    h += `<div>${esc(sub)}. 아래 ${d.sig.length}개 항목을 종합한 결과입니다. `
       + `이 표시는 앞날의 예측이 아니라 지금 지표들이 얼마나 한쪽으로 모여 있는지를 나타냅니다.</div>`;

    h += `<h4>항목별로 보면</h4>`;
    d.sig.forEach(x => {
      const ar = x.dir > 0 ? ["up", "▲"] : x.dir < 0 ? ["dn", "▼"] : ["nt", "•"];
      h += `<div class="sig"><span class="ar ${ar[0]}">${ar[1]}</span>`
         + `<span class="nm">${esc(x.nm)}</span><span class="tx">${esc(x.tx)}</span></div>`;
    });

    h += `<h4>지켜볼 숫자</h4><div class="tx">`;
    const watch = [];
    if (lastAnalysis && lastAnalysis.sup)
      watch.push(`아래로 ${fmtPrice(lastAnalysis.sup.price)}이 깨지는지 (여기가 무너지면 흐름이 달라집니다)`);
    if (lastAnalysis && lastAnalysis.res)
      watch.push(`위로 ${fmtPrice(lastAnalysis.res.price)}을 거래량과 함께 넘는지`);
    if (showRSI && rsiLast != null)
      watch.push(`RSI가 중간선 50을 지키는지 (지금 ${rsiLast.toFixed(1)})`);
    if (mkt.atr)
      watch.push(`이 시간봉의 평균 변동폭은 ${fmtPrice(mkt.atr.abs)}, 약 ${mkt.atr.pct.toFixed(1)}%입니다. `
        + `손절 폭을 이보다 좁게 잡으면 방향이 맞아도 흔들림에 먼저 털립니다`);
    h += watch.length ? watch.map(t => `· ${esc(t)}`).join("<br>") : "아직 표시할 기준이 없습니다.";
    h += `</div>`;

    h += `<div class="note">지표는 서로 다른 말을 할 때가 더 많습니다. 그럴 때는 억지로 한 방향을 고르기보다 `
       + `기다리는 것이 답인 경우가 많습니다. 특히 "혼조"로 나올 때가 그렇습니다.<br><br>`
       + `자동 계산된 참고 자료이며 매수·매도 권유가 아닙니다. 투자 판단과 그 결과의 책임은 본인에게 있습니다.</div>`;

    body.className = "rich";
    body.innerHTML = h;
  }

  $("mkt").addEventListener("click", e => {
    if (e.target.closest(".mhelp")) showMktGuide();
    else showDigest();
  });


  // 갱신 주기: 김프·펀딩은 자주, 심리지수는 하루 몇 번만 바뀌므로 느리게
  setInterval(() => refreshMkt("kimp"), 30000);
  setInterval(() => refreshMkt("funding"), 60000);
  setInterval(() => refreshMkt("fng"), 600000);

  // ── 헤더 갱신 ──
  function updatePrice(p) {
    const el = $("price");
    el.textContent = fmtPrice(p);
    if (lastPrice !== null && p !== lastPrice) {
      el.classList.remove("tick-up", "tick-down");
      void el.offsetWidth;
      el.classList.add(p > lastPrice ? "tick-up" : "tick-down");
    }
    lastPrice = p;
    document.title = `${fmtPrice(p)} · ${coin.name}`;
  }
  function updateTicker(t) {
    // miniTicker: c 현재가, o 24h 시가, h, l, v
    const c = +t.c, o = +t.o;
    const chg = ((c - o) / o) * 100;
    const el = $("chg24");
    el.textContent = (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%";
    el.className = chg >= 0 ? "up" : "down";
    $("high24").textContent = fmtPrice(+t.h);
    $("low24").textContent = fmtPrice(+t.l);
    $("vol24").textContent = fmtVol(+t.v);
    updatePrice(c);
  }
  function stampUpdate() {
    $("last-update").textContent = "최근 갱신 " + new Date().toLocaleTimeString("ko-KR", { hour12: false });
  }

  // ── 시간봉 로드 ──
  async function loadTimeframe(tf) {
    const seq = ++loadSeq;
    $("loading").style.display = "flex";
    hideBanner();
    try {
      const path = `/klines?symbol=${coin.symbol}&interval=${tf.interval}&limit=${tf.limit}`;
      let raw = null, lastErr = null;
      for (let n = 0; n < REST_HOSTS.length; n++) {
        const idx = (restIdx + n) % REST_HOSTS.length;
        try {
          const res = await fetch(REST_HOSTS[idx] + path, { signal: AbortSignal.timeout(7000) });
          if (!res.ok) throw new Error("HTTP " + res.status);
          raw = await res.json();
          restIdx = idx;   // 성공한 서버를 기억
          break;
        } catch (e) { lastErr = e; }
      }
      if (!raw) throw lastErr || new Error("모든 서버 접속 실패");
      if (seq !== loadSeq) return; // 이미 다른 탭으로 전환됨

      let bars = raw.map(klineToBar);
      if (tf.aggregateYear) bars = aggregateYearly(bars);

      barMap = new Map(bars.map(b => [tf.aggregateYear ? b.year : b.time, b]));
      chart.applyOptions({ timeScale: { timeVisible: !!tf.intraday, secondsVisible: false } });
      applyBars(bars);
      restoreView(tf.key);   // 이 종목·시간봉에서 보던 화면 복원 (없으면 전체 맞춤)

      const last = bars[bars.length - 1];
      if (last) updatePrice(last.close);
      stampUpdate();
      runAnalysis();
      restoreUserLines(tf.key);   // 저장된 사용자 선 복원

      // 이평선 (일봉·주봉). 먼저 즉시 그릴 수 있는 선을 표시하고,
      // 일봉의 200주선은 주봉 데이터가 도착한 뒤 추가로 얹는다.
      if (MA_TIMEFRAMES.has(tf.key)) {
        renderMAs(bars);
        if (tf.key === "1d" && !weeklyBarsOf() && !weeklyFailed.has(coin.key)) {
          ensureWeeklyBars().then(() => {
            if (seq !== loadSeq) return;   // 그 사이 다른 탭으로 전환됨
            if (weeklyBarsOf()) renderMAs(barsArr.length ? barsArr : bars);
          });
        }
      } else {
        clearMAs();
      }
    } catch (e) {
      if (seq !== loadSeq) return;
      showBanner("데이터를 불러오지 못했습니다 (" + (e && e.message || e) + "). " +
        "Claude 미리보기 화면에서는 외부 API가 차단될 수 있으니, 파일을 브라우저에서 열거나 GitHub Pages에 배포해 사용해 주세요.", tf);
    } finally {
      if (seq === loadSeq) $("loading").style.display = "none";
    }
  }

  // ── WebSocket ──
  function connectWS(tf) {
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    const low = coin.symbol.toLowerCase();
    const streams = `${low}@kline_${tf.interval}/${low}@miniTicker`;
    setConn("", "연결 중…");
    ws = new WebSocket(WS_HOSTS[wsIdx] + streams);

    ws.onopen = () => { wsRetry = 0; setConn("live", "실시간"); };

    ws.onmessage = ev => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      const stream = msg.stream || "";
      const data = msg.data;
      if (!data) return;

      if (stream.endsWith("miniTicker")) {
        updateTicker(data);
        stampUpdate();
        return;
      }
      if (data.e === "kline") {
        const k = data.k;
        const incoming = {
          time: Math.floor(k.t / 1000),
          open: +k.o, high: +k.h, low: +k.l, close: +k.c, volume: +k.v,
        };
        if (tf.aggregateYear) {
          // 월봉 스트림을 현재 연봉에 병합
          const y = new Date(incoming.time * 1000).getUTCFullYear();
          let bar = barMap.get(y);
          if (!bar) {
            bar = { time: Math.floor(Date.UTC(y, 0, 1) / 1000),
              open: incoming.open, high: incoming.high, low: incoming.low,
              close: incoming.close, volume: incoming.volume, year: y };
            barMap.set(y, bar);
          }
          bar.high = Math.max(bar.high, incoming.high);
          bar.low = Math.min(bar.low, incoming.low);
          bar.close = incoming.close;
          upsertBar(bar);
        } else {
          barMap.set(incoming.time, incoming);
          upsertBar(incoming);
        }
        if (k.x) {
          runAnalysis();          // 봉 마감 시 지지/저항·추세선 재계산
          if (MA_TIMEFRAMES.has(tf.key)) {
            // 주봉이 마감되면 200주선도 새 값을 반영해야 하므로 캐시를 갱신
            if (tf.key === "1w") weeklyCache.delete(coin.key);
            renderMAs(barsArr);
          }
        } else {
          updateMAsLive();        // 진행 중인 봉: 이평선 마지막 점만 갱신
          updateRSILive();        // 진행 중인 봉: RSI 마지막 점만 갱신
        }
        stampUpdate();
      }
    };

    ws.onclose = () => {
      wsIdx = (wsIdx + 1) % WS_HOSTS.length;   // 다음 예비 서버로 전환
      const delay = Math.min(1000 * 2 ** wsRetry, 15000);
      wsRetry++;
      setConn("err", `재연결 대기 (${Math.round(delay / 1000)}초)`);
      setTimeout(() => { if (ws && ws.readyState === WebSocket.CLOSED) connectWS(current); }, delay);
    };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }

  // ── 종목 전환 ──
  function switchCoin(c) {
    if (c.key === coin.key) return;
    saveViewNow();          // 떠나기 전 지금 보던 화면을 확정 저장
    coin = c;
    try { localStorage.setItem(LAST_SYMBOL_KEY, c.key); } catch {}
    // 이전 종목의 흔적을 모두 지운다. 하나라도 남으면 가격대가 전혀 다른
    // 선이 새 종목 차트에 그대로 떠서 잘못된 판단을 부른다.
    if (ws) { try { ws.close(); } catch {} ws = null; }
    detachUserLines();          // 그린 선 (종목별 저장분은 로드 후 복원)
    clearMAs();
    if (rsiChart) { clearRSIOverlays(); try { setRSIData([], []); } catch {} }
    clearAnalysis();
    mkt.kimp = null; mkt.funding = null; renderMkt();   // 종목별 값이므로 즉시 비운다
    lastPrice = null;
    barMap = new Map();
    applyCoinChrome();
    $("price").textContent = "—";
    $("chg24").textContent = "";
    $("chg24").className = "";
    loadTimeframe(current).then(() => connectWS(current));
  }

  // ── 탭 전환 ──
  function switchTimeframe(tf) {
    if (tf.key === current.key) return;
    saveViewNow();
    current = tf;
    // 다음에 앱을 다시 열 때 이 시간봉으로 시작하도록 기억
    try { localStorage.setItem(LAST_TF_KEY, tf.key); } catch {}
    nav.querySelectorAll("button").forEach(b =>
      b.classList.toggle("active", b.dataset.key === tf.key));
    loadTimeframe(tf).then(() => connectWS(tf));
  }
  $("ai-close").addEventListener("click", () => { $("ai-panel").style.display = "none"; });

  // ── 시작 ──
  // 앱을 닫거나 배경으로 보낼 때도 마지막 화면을 남긴다 (디바운스가 못 미친 경우 대비)
  window.addEventListener("pagehide", saveViewNow);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") saveViewNow();
  });
  applyCoinChrome();
  applyRSIVisibility();   // 지난번에 RSI를 켜 뒀다면 그대로 복원
  loadTimeframe(current).then(() => {
    connectWS(current);
    refreshMkt();         // 김프·펀딩·심리지수 (실패한 항목은 조용히 빠진다)
  });
})();
</script>
</body>
