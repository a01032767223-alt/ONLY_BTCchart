</script>
<style>
  :root {
    --bg: #0c0e14;
    --panel: #131722;
    --border: #232838;
    --text: #e7ebf3;
    --muted: #8b93a7;
    --up: #ef4444;     /* 상승 = 빨강 (한국 관례) */
    --down: #3b82f6;   /* 하락 = 파랑 */
    --btc: #f7931a;
    --mono: "SF Mono", "Cascadia Mono", Consolas, "Roboto Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 헤더 ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px 16px;
    padding: calc(12px + env(safe-area-inset-top, 0px))
             calc(16px + env(safe-area-inset-right, 0px))
             10px
             calc(16px + env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .symbol { display: flex; align-items: center; gap: 8px; }
  .btc-mark {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--btc);
    color: #0c0e14;
    font-weight: 800;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .symbol .name { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
  .symbol .pair { font-size: 11px; color: var(--muted); }

  .price-block { display: flex; align-items: baseline; gap: 10px; }
  #price {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    transition: color .15s;
  }
  #price.tick-up { color: var(--up); }
  #price.tick-down { color: var(--down); }
  #chg24 {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
  }
  #chg24.up { color: var(--up); background: rgba(239,68,68,.12); }
  #chg24.down { color: var(--down); background: rgba(59,130,246,.12); }

  .stats { display: flex; gap: 14px; margin-left: auto; }
  .stat { text-align: right; }
  .stat .k { font-size: 10px; color: var(--muted); }
  .stat .v { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* ── 시간봉 탭 / 도구 모음 ── */
  nav, #tools {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: thin;
  }
  #tools { padding: 7px 16px; background: rgba(19,23,34,.5); }

  /* ── 종목 선택 바 ── */
  #coins { padding: 7px 16px; gap: 6px; background: rgba(19,23,34,.35); }
  #coins button {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 11px 4px 5px;
    border: 1px solid var(--border);
    border-radius: 999px;
    flex: 0 0 auto;
  }
  #coins button .cm {
    width: 19px; height: 19px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; color: #0c0e14;
    flex: 0 0 auto;
  }
  #coins button.active {
    /* 활성 종목은 그 코인의 고유색으로 테두리를 준다 (--cc는 JS가 주입) */
    background: var(--panel);
    border-color: var(--cc);
    color: var(--text);
  }
  #tools .grp-label {
    font-size: 10px; color: var(--muted); font-weight: 700;
    letter-spacing: .5px; margin-right: 2px; white-space: nowrap;
  }
  nav button, #tools button {
    background: none;
    border: 1px solid transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    flex-shrink: 0;
  }
  nav button:hover, #tools button:hover { color: var(--text); background: var(--panel); }
  nav button.active {
    color: var(--btc);
    background: rgba(247,147,26,.1);
    border-color: rgba(247,147,26,.35);
  }
  nav button:focus-visible, #tools button:focus-visible { outline: 2px solid var(--btc); outline-offset: 1px; }

  .sep { width: 1px; height: 18px; background: var(--border); margin: 0 8px; flex-shrink: 0; }
  .toggle { font-size: 12px; }
  .toggle.on-sr { color: #22c55e; background: rgba(34,197,94,.16); border-color: rgba(34,197,94,.55); }
  .toggle.on-tr { color: #f59e0b; background: rgba(245,158,11,.16); border-color: rgba(245,158,11,.55); }

  /* 자동 분석 그룹: 지금 켜져 있는 항목이 한눈에 들어오도록 항목마다 고유색 + 표시등.
     꺼진 항목은 회색 점만 흐리게 남아 "끌 수 있는 항목"이라는 것도 함께 알린다. */
  .tool-group .toggle {
    display: inline-flex; align-items: center; gap: 6px;
    border-color: rgba(139,147,167,.2);
  }
  .tool-group .toggle::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; opacity: .22;
    transition: opacity .12s, box-shadow .12s;
  }
  /* 상태가 없는 실행 버튼(지우기 등)에는 표시등을 두지 않는다 */
  .tool-group .toggle.act::before { display: none; }
  .tool-group .toggle.on-sr,
  .tool-group .toggle.on-tr,
  .tool-group .toggle.on-rsi,
  .tool-group .toggle.on-draw { font-weight: 700; }
  .tool-group .toggle.on-sr::before,
  .tool-group .toggle.on-tr::before,
  .tool-group .toggle.on-rsi::before,
  .tool-group .toggle.on-draw::before { opacity: 1; box-shadow: 0 0 7px currentColor; }
  .toggle.on-draw { color: #c084fc; background: rgba(192,132,252,.2); border-color: rgba(192,132,252,.62); }
  .toggle.on-ai { color: var(--btc); border-color: rgba(247,147,26,.35); background: rgba(247,147,26,.08); }

  /* 도구 묶음: 자동 분석 / 직접 그리기를 시각적으로 분리 */
  .tool-group {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 8px 3px 6px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .tool-group.auto {
    border: 1px solid rgba(139,147,167,.22);
    background: rgba(139,147,167,.05);
  }
  .tool-group.draw {
    border: 1px solid rgba(192,132,252,.3);
    background: rgba(192,132,252,.06);
  }
  .tool-group.draw .grp-label { color: #c084fc; }

  #sr-info { display: flex; gap: 14px; flex-wrap: wrap; }
  #sr-info .sup { color: #22c55e; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #sr-info .res { color: #f59e0b; font-family: var(--mono); font-variant-numeric: tabular-nums; }

  #draw-hint {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #c084fc; z-index: 5; pointer-events: none;
    background: rgba(19,23,34,.85); padding: 4px 12px; border-radius: 6px;
    white-space: nowrap;
  }
  #draw-hint:empty { display: none; }

  /* ── RSI 보조 지표 창 ── */
  #rsi-wrap {
    position: relative;
    height: 260px;
    flex: 0 0 auto;
    border-top: 1px solid var(--border);
    display: none;
  }
  #rsi-wrap.on { display: block; }
  #rsi { position: absolute; top: 28px; left: 0; right: 0; bottom: 0; }
  /* 창 높이 조절 손잡이 — 위아래로 끌어 원하는 간격으로 맞춘다.
     손가락으로 잡아야 하므로 높이를 24px로 넉넉히 두고, 눌린 상태를 색으로 알린다. */
  #rsi-grip {
    position: absolute; top: 0; left: 0; right: 0; height: 28px; z-index: 7;
    cursor: ns-resize; touch-action: none; user-select: none;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: rgba(139,147,167,.06);
    border-bottom: 1px solid rgba(35,40,56,.9);
    font-size: 10px; color: transparent;
  }
  #rsi-grip::before {
    content: ""; width: 44px; height: 4px; border-radius: 3px;
    background: rgba(139,147,167,.45); transition: background .12s, width .12s;
  }
  #rsi-grip:hover { background: rgba(139,147,167,.1); }
  #rsi-grip:hover::before { background: rgba(139,147,167,.8); }
  #rsi-grip.drag { background: rgba(247,147,26,.1); color: var(--btc); }
  #rsi-grip.drag::before { background: var(--btc); width: 56px; }
  #rsi-grip .hint {
    position: absolute; right: 12px;

<script>
(() => {
  // 접속 실패 시 순서대로 예비 서버 자동 전환
  const REST_HOSTS = [
    "https://data-api.binance.vision/api/v3",
    "https://api.binance.com/api/v3",
    "https://api1.binance.com/api/v3",
    "https://api2.binance.com/api/v3",
  ];
  let restIdx = 0;
  const WS_HOSTS = [
    "wss://data-stream.binance.vision/stream?streams=",
    "wss://stream.binance.com:9443/stream?streams=",
  ];
  let wsIdx = 0;

  // 시간봉 정의 (연봉은 월봉을 클라이언트에서 집계)
  // width: 스윙 판정에 필요한 좌우 봉 수, tol: 레벨 클러스터 허용폭 (시간봉 변동성에 맞춤)
  const TIMEFRAMES = [
    { key: "1h", label: "1시간", interval: "1h", limit: 500, intraday: true,  width: 5, tol: 0.004 },
    { key: "4h", label: "4시간", interval: "4h", limit: 500, intraday: true,  width: 5, tol: 0.006 },
    { key: "1d", label: "일봉",  interval: "1d", limit: 730, intraday: false, width: 4, tol: 0.010 },
    { key: "1w", label: "주봉",  interval: "1w", limit: 520, intraday: false, width: 3, tol: 0.014 },
    { key: "1M", label: "월봉",  interval: "1M", limit: 200, intraday: false, width: 2, tol: 0.018 },
    { key: "1y", label: "연봉",  interval: "1M", limit: 1000, intraday: false, width: 1, tol: 0.025, aggregateYear: true },
  ];

  // ══════════════════════════════════════════════════════════
  //  종목 레지스트리 — 심볼·이름·색·정밀도를 한 곳에서 관리한다.
  //  헤더, 워터마크, API 주소, 웹소켓 스트림, AI 해설이 모두 이 표를 참조하므로
  //  종목을 늘릴 때 이 배열에 한 줄만 추가하면 된다.
  //  decimals/minMove: 종목마다 가격대가 100배 이상 차이나므로 반드시 따로 잡는다.
  //  (DOGE를 소수점 2자리로 표시하면 하루 변동폭이 눈금 두어 칸으로 뭉개진다)
  // ══════════════════════════════════════════════════════════
  const SYMBOLS = [
    { key: "BTC",  symbol: "BTCUSDT",  name: "비트코인", mark: "₿",
      color: "#f7931a", decimals: 1, minMove: 0.1 },
    { key: "ETH",  symbol: "ETHUSDT",  name: "이더리움", mark: "Ξ",
      color: "#627eea", decimals: 2, minMove: 0.01 },
    { key: "XRP",  symbol: "XRPUSDT",  name: "리플",     mark: "X",
      color: "#00aae4", decimals: 4, minMove: 0.0001 },
    { key: "SOL",  symbol: "SOLUSDT",  name: "솔라나",   mark: "S",
      color: "#14f195", decimals: 2, minMove: 0.01 },
    { key: "DOGE", symbol: "DOGEUSDT", name: "도지코인", mark: "Ð",
      color: "#c2a633", decimals: 5, minMove: 0.00001 },
  ];
  const LAST_SYMBOL_KEY = "coinchart_last_symbol";
  let coin = SYMBOLS[0];   // 기본: 비트코인
  try {
    const savedCoin = SYMBOLS.find(s => s.key === localStorage.getItem(LAST_SYMBOL_KEY));
    if (savedCoin) coin = savedCoin;
  } catch {}

  const $ = id => document.getElementById(id);
  // 가격 표시: 종목별 소수점 자릿수를 따른다. 값이 아주 클 때는 자릿수를 줄여
  // 좁은 모바일 화면에서 숫자가 넘치지 않게 한다.
  const fmtPrice = v => {
    if (!Number.isFinite(v)) return "—";
    const d = v >= 10000 ? Math.min(coin.decimals, 1)
            : v >= 1000  ? Math.min(coin.decimals, 2)
            : coin.decimals;
    return v.toLocaleString("en-US", { maximumFractionDigits: d });
  };
  const fmtVol = v => v.toLocaleString("en-US", { maximumFractionDigits: 0 });

  // ── 차트 초기화 ──
  const chart = LightweightCharts.createChart($("chart"), {
    layout: {
      background: { type: "solid", color: "#0c0e14" },
      textColor: "#8b93a7",
      fontFamily: "'SF Mono', Consolas, monospace",
      fontSize: 11,
    },
    grid: {
      vertLines: { color: "rgba(35,40,56,.55)" },
      horzLines: { color: "rgba(35,40,56,.55)" },
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: "#8b93a7", width: 1, style: 2, labelBackgroundColor: "#232838" },
      horzLine: { color: "#8b93a7", width: 1, style: 2, labelBackgroundColor: "#232838" },
    },
    rightPriceScale: { borderColor: "#232838", scaleMargins: { top: 0.08, bottom: 0.22 } },
    timeScale: { borderColor: "#232838", rightOffset: 4 },
    watermark: {
      visible: true, text: coin.key + "/USDT", color: "rgba(139,147,167,.08)",
      fontSize: 44, horzAlign: "center", vertAlign: "center",
    },
    localization: { priceFormatter: fmtPrice },
  });

  // 가격축 범위를 잠시 지정할 때 쓰는 훅. 평소에는 기본 자동맞춤(orig)을 그대로 쓰고,
  // 화면 복원 순간에만 저장해 둔 범위를 돌려줘 세로 위치까지 되살린다.
  let pinnedPriceRange = null;
  const candles = chart.addCandlestickSeries({
    upColor: "#ef4444", downColor: "#3b82f6",
    borderUpColor: "#ef4444", borderDownColor: "#3b82f6",
    wickUpColor: "#ef4444", wickDownColor: "#3b82f6",
    // 가격 눈금 단위도 종목별로 잡아야 저가 코인의 움직임이 뭉개지지 않는다
    priceFormat: { type: "price", precision: coin.decimals, minMove: coin.minMove },
    autoscaleInfoProvider: orig => pinnedPriceRange
      ? { priceRange: { minValue: pinnedPriceRange.min, maxValue: pinnedPriceRange.max } }
      : orig(),
  });
  const volume = chart.addHistogramSeries({
    priceFormat: { type: "volume" },
    priceScaleId: "vol",
  });
  // 거래량 막대만으로는 지금이 많은 편인지 알 수 없어 20봉 평균선을 함께 긋는다
  const volMA = chart.addLineSeries({
    priceScaleId: "vol",
    color: "rgba(226,232,240,.5)", lineWidth: 1,
    priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
  });
  chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.84, bottom: 0 } });

  let lastW = 0, lastH = 0, resizeRaf = 0;
  new ResizeObserver(() => {
    const el = $("chart-wrap");
    const w = el.clientWidth, h = el.clientHeight;
    if (w === lastW && h === lastH) return;   // 실제 크기 변화가 없으면 무시
    lastW = w; lastH = h;
    if (resizeRaf) return;
    resizeRaf = requestAnimationFrame(() => {
      resizeRaf = 0;
      chart.applyOptions({ width: w, height: h });
      scheduleHandles();
    });
  }).observe($("chart-wrap"));

  // ── 상태 ──
  // 마지막으로 본 시간봉을 기억한다. 앱을 닫았다 다시 열면 그때 보던 봉으로 시작.
  // 저장값이 없거나 알 수 없는 값이면 일봉(기본)으로 시작한다.
  const LAST_TF_KEY = "btcchart_last_tf";
  let current = TIMEFRAMES[2];   // 기본: 일봉
  try {
    const savedKey = localStorage.getItem(LAST_TF_KEY);
    const savedTf = TIMEFRAMES.find(t => t.key === savedKey);
    if (savedTf) current = savedTf;
  } catch {}
  let ws = null;
  let wsRetry = 0;
  let lastPrice = null;
  let barMap = new Map();        // time(sec) -> candle (연봉 집계용은 year -> candle)
  let loadSeq = 0;
  let showSR = true, showTrend = true;
  let lastAnalysis = null;
  let priceLines = [];
  let trendSeries = [];

  // ── 자동 분석 엔진: 스윙 포인트 → 지지/저항 클러스터 + 추세선 ──
  function detectPivots(bars, width) {
    const highs = [], lows = [];
    for (let i = width; i < bars.length - width; i++) {
      let isH = true, isL = true;
      for (let j = i - width; j <= i + width; j++) {
        if (j === i) continue;
        if (bars[j].high >= bars[i].high) isH = false;
        if (bars[j].low <= bars[i].low) isL = false;
        if (!isH && !isL) break;
      }
      if (isH) highs.push({ i, time: bars[i].time, price: bars[i].high });
      if (isL) lows.push({ i, time: bars[i].time, price: bars[i].low });
    }
    return { highs, lows };
  }

  // 근접한 스윙 레벨을 묶어 터치 횟수가 많은 가격대를 지지/저항으로 판정
  // 체이닝 방지: 평균과의 거리만 보면 100k→101k→102k…처럼 조금씩 이어붙어
  // 한 클러스터가 수십 % 폭으로 부풀 수 있다. 클러스터 전체 폭도 함께 제한한다.
  function clusterLevels(pivots, tolPct) {
    const pts = [...pivots].sort((a, b) => a.price - b.price);
    const clusters = [];
    for (const p of pts) {
      const c = clusters[clusters.length - 1];
      const nearAvg = c && (p.price - c.avg) / c.avg <= tolPct;
      const inSpan  = c && (p.price - c.min) / c.min <= tolPct * 2;
      if (nearAvg && inSpan) {
        c.points.push(p);
        c.avg = c.points.reduce((s, q) => s + q.price, 0) / c.points.length;
      } else {
        clusters.push({ points: [p], avg: p.price, min: p.price });
      }
    }
    return clusters.map(c => ({ price: c.avg, touches: c.points.length }));
  }

  // 스윙 포인트 쌍을 이어 최적 추세선 선택.
  // 투자 관점 반영: [형성 구간(p1~p2)]은 캔들 관통 금지를 엄격 적용하되,
  // [연장 구간(p2~현재)]의 돌파는 허용한다 — 하락 추세선 상향 돌파(또는 상승 추세선 하향 이탈)는
  // 선을 지울 이유가 아니라 지지↔저항 역할 전환 신호이기 때문. 단, 연장 구간의 40% 넘게
  // 반대편에 머문 선은 이미 낡은 추세로 보고 제외한다.
  function bestTrendline(pivots, bars, type, tolPct) {
    if (pivots.length < 2) return null;
    let best = null;
    const lastIdx = bars.length - 1;
    for (let a = 0; a < pivots.length - 1; a++) {
      for (let b = a + 1; b < pivots.length; b++) {
        const p1 = pivots[a], p2 = pivots[b];
        if (p2.i - p1.i < 3) continue;               // 너무 붙은 두 점은 기울기가 불안정
        const slope = (p2.price - p1.price) / (p2.i - p1.i);

        // 검증 1: 형성 구간 관통 금지
        // 즉시 탈락은 명백한 관통(허용폭 3배)만. 가벼운 스침(1배 초과)은 구간의 20%까지 허용
        // — 둥근 바닥/천장에서 곡률 때문에 직선이 살짝 파고드는 자연스러운 현상을 수용
        let pierce = 0, ok = true;
        const span = p2.i - p1.i;
        const pierceAllow = Math.max(2, Math.round(span * 0.2));
        for (let i = p1.i; i <= p2.i; i++) {
          const lv = p1.price + slope * (i - p1.i);
          if (lv <= 0) { ok = false; break; }
          const over = type === "sup"
            ? (lv - bars[i].low) / lv
            : (bars[i].high - lv) / lv;
          if (over > tolPct * 3) { ok = false; break; }
          if (over > tolPct) pierce++;
        }
        if (!ok || pierce > pierceAllow) continue;

        // 검증 2: 연장 구간 돌파 비율 (절반 초과 시 낡은 추세로 제외 — 최근 돌파는 유지)
        let extBreak = 0;
        const extLen = lastIdx - p2.i;
        for (let i = p2.i + 1; i <= lastIdx; i++) {
          const lv = p1.price + slope * (i - p1.i);
          if (lv <= 0) { ok = false; break; }
          const over = type === "sup"
            ? (lv - bars[i].low) / lv
            : (bars[i].high - lv) / lv;
          if (over > tolPct * 2) extBreak++;
        }
        if (!ok) continue;
        if (extLen > 0 && extBreak / extLen > 0.5) continue;

        // 검증 3: 스윙 포인트 접촉 수
        let touches = 0;
        for (const q of pivots) {
          const lv = p1.price + slope * (q.i - p1.i);
          if (Math.abs((q.price - lv) / lv) <= tolPct) touches++;
        }
        if (touches < 2) continue;

        // 점수: 접촉 3회↑ 우대 + 넓은 간격 가산(긴 추세선 우선) + 미돌파 우대
        //     + 최근성 가산 — p2가 최신 스윙일수록 지금 시세와 관련 깊은 선이므로 우대
        const recency = 1 - Math.min(1, (lastIdx - p2.i) / Math.max(1, lastIdx));
        const score = touches * 10 + (touches >= 3 ? 25 : 0)
          + span * 0.25 + (extBreak === 0 ? 15 : 0) + recency * 30;
        if (!best || score > best.score) best = { p1, p2, slope, touches, score, broken: extBreak > 0 };
      }
    }
    return best;
  }

  // 정밀 근사 추세선(볼록 껍질 방식): 회귀선 평행이동은 극단 스윙 1개에만 닿아
  // 캔들에서 붕 떠 보이는 문제가 있었다. 볼록 껍질의 경계 변은 정의상
  // ① 실제 스윙 꼬리 2개를 정확히 지나고 ② 어떤 스윙도 선을 관통하지 않으므로
  // 눈으로 봐도 "제대로 그은 선"이 된다. 여러 변 중 최근 구간을 덮고
  // 현재가에서 크게 벗어나지 않는 변을 고른다.
  function hullTrendline(pivots, type, tolPct, lastIdx, price) {
    if (pivots.length < 2) return null;
    const pts = [...pivots].sort((a, b) => a.i - b.i);
    const cross = (o, a, b) =>
      (a.i - o.i) * (b.price - o.price) - (a.price - o.price) * (b.i - o.i);
    const hull = [];
    for (const p of pts) {
      while (hull.length >= 2) {
        const c = cross(hull[hull.length - 2], hull[hull.length - 1], p);
        // 저항선 = 위쪽 껍질(좌회전 제거), 지지선 = 아래쪽 껍질(우회전 제거)
        if (type === "res" ? c >= 0 : c <= 0) hull.pop(); else break;
      }
      hull.push(p);
    }
    if (hull.length < 2) return null;
    let best = null;
    for (let k = 0; k < hull.length - 1; k++) {
      const p1 = hull[k], p2 = hull[k + 1];
      if (p2.i === p1.i) continue;
      const slope = (p2.price - p1.price) / (p2.i - p1.i);
      const endNow = p1.price + slope * (lastIdx - p1.i);
      if (endNow <= 0) continue;
      // 유효성: 현재가에서 15% 넘게 벗어난 변은 지금 시세와 무관한 옛 경계로 보고 제외
      if (price > 0 && Math.abs(endNow - price) / price > 0.15) continue;
      let touches = 0;
      for (const q of pts) {
        const lv = p1.price + slope * (q.i - p1.i);
        if (lv > 0 && Math.abs((q.price - lv) / lv) <= tolPct) touches++;
      }
      // 점수: 접촉 수 + 최근성(p2가 최신일수록) + 현재가 근접 가산
      const recency = 1 - Math.min(1, (lastIdx - p2.i) / Math.max(1, lastIdx));
      const prox = price > 0 ? 1 - Math.min(1, Math.abs(endNow - price) / price / 0.15) : 0;
      const score = touches * 10 + recency * 30 + prox * 15;
      if (!best || score > best.score) best = { p1, p2, slope, touches, score };
    }
    if (!best) return null;
    return { p1: best.p1, slope: best.slope, touches: Math.max(best.touches, 2) };
  }

  // 근사 추세선: 엄격한 조건을 만족하는 선이 없어도 투자 판단 기준은 항상 필요하므로,
  // 스윙 포인트들을 회귀선으로 적합한 뒤 저항선은 모든 고점 위로, 지지선은 모든 저점
  // 아래로 평행 이동해 "전체 추세의 경계선"을 만든다. 스윙 2개만 있으면 항상 계산 가능.
  function regressionTrendline(pivots, type, tolPct) {
    if (pivots.length < 2) return null;
    const n = pivots.length;
    const mx = pivots.reduce((s, p) => s + p.i, 0) / n;
    const my = pivots.reduce((s, p) => s + p.price, 0) / n;
    let num = 0, den = 0;
    for (const p of pivots) { num += (p.i - mx) * (p.price - my); den += (p.i - mx) ** 2; }
    const slope = den ? num / den : 0;
    // 경계로 평행 이동
    let shift = type === "res" ? -Infinity : Infinity;
    for (const p of pivots) {
      const d = p.price - (my + slope * (p.i - mx));
      shift = type === "res" ? Math.max(shift, d) : Math.min(shift, d);
    }
    const first = pivots[0];
    const p1 = { i: first.i, time: first.time, price: my + slope * (first.i - mx) + shift };
    if (p1.price <= 0) return null;
    let touches = 0;
    for (const q of pivots) {
      const lv = p1.price + slope * (q.i - p1.i);
      if (lv > 0 && Math.abs((q.price - lv) / lv) <= tolPct) touches++;
    }
    return { p1, slope, touches: Math.max(touches, 1), approx: true };
  }

  function clearAnalysis() {
    priceLines.forEach(l => { try { candles.removePriceLine(l); } catch {} });
    priceLines = [];
    trendSeries.forEach(s => { try { chart.removeSeries(s); } catch {} });
    trendSeries = [];
    clearPriceDivLines();   // 가격 창에 그려진 다이버전스 연결선
  }

  function updateSRFooter(sup, res, price) {
    const el = $("sr-info");
    if (!sup && !res) { el.textContent = "탐지된 지지/저항 없음 (데이터 부족)"; return; }
    const parts = [];
    if (sup) {
      const d = ((sup.price - price) / price * 100).toFixed(1);
      parts.push(`<span class="sup">▼ 지지 ${fmtPrice(sup.price)} (${d}%) ×${sup.touches}</span>`);
    }
    if (res) {
      const d = ((res.price - price) / price * 100).toFixed(1);
      parts.push(`<span class="res">▲ 저항 ${fmtPrice(res.price)} (+${d}%) ×${res.touches}</span>`);
    }
    el.innerHTML = parts.join("");
  }

  function runAnalysis() {
    clearAnalysis();
    const bars = [...barMap.values()].sort((a, b) => a.time - b.time);
    barsArr = bars;   // 자석 스냅 계산에 사용
    runRSI(bars);     // RSI·RSI 추세선·다이버전스 (켜져 있을 때만 동작)
    updateLocalStats(bars);   // ATR·거래량 배수 (네트워크 없이 캔들에서 계산)
    // 기준가는 "차트에 실제로 그려진 마지막 봉의 종가"를 쓴다.
    // 헤더의 miniTicker 값(lastPrice)을 쓰면, 두 피드가 어긋났을 때
    // 선은 캔들 시리즈 좌표에 그려지는데 기준만 다른 곳을 가리켜
    // 저항선이 최근 캔들보다 아래에 깔리는 모순이 생긴다.
    // 정상 상태에서는 kline 스트림이 마지막 봉 종가를 실시간 갱신하므로 두 값이 같다.
    const lastClose = bars.length ? bars[bars.length - 1].close : 0;
    const price = lastClose || lastPrice || 0;
    if (bars.length < 15 || !price) { updateSRFooter(null, null, price); return; }
    // 두 피드가 크게 어긋나면(>3%) 데이터 이상이므로 사용자에게 알린다
    if (lastPrice && lastClose && Math.abs(lastPrice - lastClose) / lastClose > 0.03) {
      showBanner(`시세 불일치: 차트 마지막 봉 ${fmtPrice(lastClose)} vs 실시간 ${fmtPrice(lastPrice)}. ` +
        `봉 데이터가 갱신되지 않았을 수 있으니 시간봉을 다시 눌러 새로 불러와 주세요.`, current);
    }

    const width = current.width;
    // 허용오차 자동 조정: 시간봉별 기준값은 BTC 변동성에 맞춰 정해진 값이라
    // DOGE처럼 더 출렁이는 종목에서는 너무 좁고, 조용한 구간에서는 너무 넓다.
    // 최근 120봉의 봉당 변동폭(고가-저가) 중앙값을 재서 기준 대비 비율만큼 넓히거나 좁힌다.
    // 지나친 왜곡을 막기 위해 0.6~2.0배로 제한한다.
    const tol = (() => {
      const base = current.tol;
      const win = bars.slice(-120);
      if (win.length < 30) return base;
      const rng = win
        .map(b => (b.high - b.low) / b.close)
        .filter(v => Number.isFinite(v) && v > 0)
        .sort((a, b) => a - b);
      if (!rng.length) return base;
      const med = rng[Math.floor(rng.length / 2)];
      const BTC_REF = 0.025;                  // 기준값 산정에 쓰인 BTC의 전형적 봉 변동폭
      const scale = Math.min(2.0, Math.max(0.6, med / BTC_REF));
      return base * scale;
    })();
    // 차트에 보이는 전체 구간을 분석 (기존 300봉 제한 → 화면 밖 상단 구조가 누락되던 문제 해결)
    const lookback = bars.slice(-800);
    const { highs, lows } = detectPivots(lookback, width);

    let nearestSup = null, nearestRes = null;

    // ① 지지/저항 수평선 — 현재가 아래(지지)와 위(저항)를 각각 따로 선정
    // 기존 "가까운 순 4개"만 뽑던 방식은 하락장 일봉처럼 가격 범위가 넓을 때
    // 네 줄이 전부 현재가 바로 옆에 뭉치고, 머리 위 매물대(예: 전고점 구간)가
    // 통째로 안 보이는 문제가 있었다. 이제 거리 밴드별 대표를 보장한다.
    //   근접 2개(즉시 매매 판단) + 밴드별 최강 레벨(구조 파악) → 최대 6개
    if (showSR) {
      const clusters = clusterLevels([...highs, ...lows], tol);
      const MAX_LV = 6;
      // 밴드: 현재가 대비 이격률 구간. 먼 구간까지 반드시 한 자리씩 배정한다.
      const BANDS = [[0, 0.08], [0.08, 0.20], [0.20, 0.45], [0.45, Infinity]];
      const pickLevels = isSup => {
        const side = clusters.filter(l => isSup ? l.price <= price : l.price > price);
        if (!side.length) return [];
        const dist = l => Math.abs(l.price - price) / price;
        const byNear = [...side].sort((a, b) => dist(a) - dist(b));
        const out = [];
        const add = lv => { if (lv && out.length < MAX_LV && !out.includes(lv)) out.push(lv); };
        // 근접 2개: 당장의 진입·손절 판단에 쓰이는 레벨
        for (const lv of byNear) { if (out.length >= 2) break; add(lv); }
        // 밴드별 대표: 각 거리 구간에서 터치 최다(동률이면 더 가까운) 레벨
        for (const [lo, hi] of BANDS) {
          const inBand = side.filter(l => { const d = dist(l); return d >= lo && d < hi; });
          if (!inBand.length) continue;
          add(inBand.reduce((m, l) =>
            !m || l.touches > m.touches ||
            (l.touches === m.touches && dist(l) < dist(m)) ? l : m, null));
        }
        // 남는 자리는 가까운 순으로 채우되, 우연한 단일 스윙은 제외
        for (const lv of byNear) { if (out.length >= MAX_LV) break; if (lv.touches >= 2) add(lv); }
        return out;
      };
      for (const lv of [...pickLevels(true), ...pickLevels(false)]) {
        const isSup = lv.price <= price;
        const far = Math.abs(lv.price - price) / price >= 0.20;
        // 중요도(터치 횟수) 4단계: 5회↑ 3px, 3~4회 2px, 2회 1px 점선, 1회 얇은 점선·흐림
        const w = lv.touches >= 5 ? 3 : lv.touches >= 3 ? 2 : 1;
        const alpha = lv.touches >= 5 ? 0.95 : lv.touches >= 3 ? 0.75 : lv.touches >= 2 ? 0.4 : 0.3;
        priceLines.push(candles.createPriceLine({
          price: lv.price,
          color: isSup ? `rgba(34,197,94,${alpha})` : `rgba(245,158,11,${alpha})`,
          lineWidth: w,
          lineStyle: w > 1 ? LightweightCharts.LineStyle.Solid : LightweightCharts.LineStyle.Dashed,
          // 먼 구조 레벨은 터치 수가 적어도 라벨을 띄운다 (가격·이격률을 읽어야 의미가 있음)
          axisLabelVisible: w > 1 || far,
          // 먼 구조 레벨은 이격률을 함께 적어 "얼마나 위인지" 바로 읽히게 한다
          title: `${isSup ? "지지" : "저항"} ×${lv.touches}` +
            (far ? ` (${((lv.price - price) / price * 100).toFixed(0)}%)` : ""),
        }));
        if (isSup && (!nearestSup || lv.price > nearestSup.price)) nearestSup = lv;
        if (!isSup && (!nearestRes || lv.price < nearestRes.price)) nearestRes = lv;
      }
    }
    updateSRFooter(nearestSup, nearestRes, price);

    // ② 추세선 (스윙 저점 연결 = 상승 지지 추세선, 스윙 고점 연결 = 하락 저항 추세선)
    // 2단계 보장: [1] 엄격 검증 통과 선 → [2] 없으면 회귀 근사선 — 어떤 시간봉에서든 추세선이 항상 표시됨
    const trendInfo = [];
    if (showTrend && !current.aggregateYear) {
      const win = lookback.slice(-300);            // 더 긴 추세를 담도록 분석 창 확대 (160→300봉)
      const { highs: wh, lows: wl } = detectPivots(win, width);
      const EXT = 60;                              // 앞으로 60봉까지 연장 — 향후 예상 경로를 더 길게 표시
      const step = win.length > 1 ? win[win.length - 1].time - win[win.length - 2].time : 0;
      const lastIdx = win.length - 1;

      const pickTrend = (pivots, type) => {
        // 최후 폴백: 단조 상승/하락처럼 스윙 자체가 없으면 구간을 4등분해
        // 각 구간의 극값을 의사 스윙으로 삼는다 → 어떤 지형에서도 추세선 계산 가능
        if (pivots.length < 2) {
          const segs = 4, segLen = Math.floor(win.length / segs);
          if (segLen < 2) return null;
          pivots = [];
          for (let sIdx = 0; sIdx < segs; sIdx++) {
            const st = sIdx * segLen;
            const en = sIdx === segs - 1 ? win.length - 1 : st + segLen - 1;
            let bi = st;
            for (let i = st; i <= en; i++) {
              if (type === "res" ? win[i].high > win[bi].high : win[i].low < win[bi].low) bi = i;
            }
            pivots.push({ i: bi, time: win[bi].time,
              price: type === "res" ? win[bi].high : win[bi].low });
          }
        } else {
          // [1단계] 엄격 검증 통과 선 (관통 금지·접촉 확인)
          const tl = bestTrendline(pivots, win, type, tol);
          if (tl) {
            const endNow = tl.p1.price + tl.slope * (lastIdx - tl.p1.i);
            // 유효성: 현재가에서 15% 이상 벗어난 엄격 선은 다음 단계로 넘긴다
            if (endNow > 0 && Math.abs(endNow - price) / price <= 0.15) return tl;
          }
        }
        // [2단계] 볼록 껍질 경계선 — 실제 스윙 꼬리 2개에 정확히 닿는 정밀 근사
        const hl = hullTrendline(pivots, type, tol, lastIdx, price);
        if (hl) return { ...hl, approx: true, hull: true };
        // [3단계] 회귀 근사 — 껍질마저 실패한 극단 지형의 최후 수단
        return regressionTrendline(pivots, type, tol);
      };

      const lines = [
        { tl: pickTrend(wl, "sup"), color: "#22c55e", kind: "지지 추세선" },
        { tl: pickTrend(wh, "res"), color: "#f59e0b", kind: "저항 추세선" },
      ];
      for (const { tl, color, kind } of lines) {
        if (!tl) continue;
        const endNow = tl.p1.price + tl.slope * (lastIdx - tl.p1.i);
        if (endNow <= 0) continue;
        // 미래 연장 지점 계산 (연장 불가 시 현재 봉까지만)
        const futPrice = tl.p1.price + tl.slope * (lastIdx + EXT - tl.p1.i);
        const canExt = step > 0 && futPrice > 0;
        const endTime = canExt ? win[lastIdx].time + step * EXT : win[lastIdx].time;
        const endVal = canExt ? futPrice : endNow;
        const s = chart.addLineSeries({
          // 시각 차등 3단계: 엄격 검증 선(진한 파선) > 껍질 경계선(파선·중간 굵기)
          //                > 회귀 근사선(얇고 흐린 점선)
          color: tl.approx && !tl.hull ? color + "88" : color,
          lineWidth: tl.hull ? (tl.touches >= 3 ? 2 : 1)
            : tl.approx ? 1 : (tl.touches >= 4 ? 3 : tl.touches >= 3 ? 2 : 1),
          lineStyle: tl.approx && !tl.hull
            ? LightweightCharts.LineStyle.Dotted
            : LightweightCharts.LineStyle.Dashed,
          priceLineVisible: false, lastValueVisible: false,
          crosshairMarkerVisible: false,
        });
        s.setData([
          { time: tl.p1.time, value: tl.p1.price },
          { time: endTime, value: endVal },
        ]);
        trendSeries.push(s);
        trendInfo.push({ kind: kind + (tl.hull ? " (경계)" : tl.approx ? " (근사)" : ""),
          slope: tl.slope, touches: tl.touches, endPrice: endNow, broken: !!tl.broken });
      }
    }

    // AI 해설용 최근 분석 결과 저장
    lastAnalysis = { price, sup: nearestSup, res: nearestRes, trends: trendInfo,
      bars: bars.slice(-30) };

    // 연장 모드가 켜진 사용자 추세선도 최신 봉 기준으로 함께 밀어준다
    // (그렇지 않으면 자동 선만 계속 늘어나고, 직접 그은 선은 그은 시점에 멈춰 있게 됨)
    if (extendMode && userTrends.length) {
      userTrends.forEach(renderTrend);
      scheduleHandles();
    }
  }

  // ══════════════════════════════════════════════════════════
  //  이동평균선 (일봉·주봉 전용)
  //  단기 21 EMA / 중기 50 EMA / 장기 200 EMA / 사이클 바닥 200주 SMA
  //  · 200주선은 관례대로 단순평균(SMA)을 쓴다. 200 EMA와는 다른 선이므로
  //    주봉에서도 두 선이 겹치지 않고 각각의 의미를 갖는다.
  //  · 일봉(730봉)으로는 200주(1,400일)를 계산할 수 없어 주봉을 따로 1회
  //    받아 계산한 뒤 일봉 시간축에 보간해 얹는다.
  // ══════════════════════════════════════════════════════════
  //  · 색 배정: 기존 요소(저항 주황·지지 초록·캔들 적청·사용자선 보라)와 겹치지
  //    않는 색만 쓴다. 특히 사이클 바닥선은 금색이 저항 주황과 혼동되므로
  //    무채색 계열로 옮기고, 중요도에 맞춰 가장 밝고 굵게 그린다.
  const MA_DEFS = [
    { key: "ema21",  label: "21 EMA",  role: "단기", type: "ema", period: 21,
      color: "#22d3ee", width: 1 },
    { key: "ema50",  label: "50 EMA",  role: "중기", type: "ema", period: 50,
      color: "#f472b6", width: 1 },
    { key: "ema200", label: "200 EMA", role: "장기", type: "ema", period: 200,
      color: "#a3e635", width: 2 },
    { key: "wma200", label: "200W",    role: "사이클 바닥", type: "sma", period: 200,
      color: "#ffffff", width: 3, weeklySource: true },
  ];
  const MA_TIMEFRAMES = new Set(["1d", "1w"]);   // 이평선을 표시할 시간봉
  const MA_STATE_KEY = "btcchart_ma_visible";

  // 표시 여부: 기본 전부 켜기, 사용자가 끈 항목은 기기에 기억
  let maVisible = {};
  MA_DEFS.forEach(d => { maVisible[d.key] = true; });
  try {
    const saved = JSON.parse(localStorage.getItem(MA_STATE_KEY));
    if (saved && typeof saved === "object") {
      MA_DEFS.forEach(d => {
        if (typeof saved[d.key] === "boolean") maVisible[d.key] = saved[d.key];
      });
    }
  } catch {}
  const saveMaState = () => {
    try { localStorage.setItem(MA_STATE_KEY, JSON.stringify(maVisible)); } catch {}
  };

  let maSeries = new Map();     // key → LineSeries
  let maValues = new Map();     // key → 마지막 계산값 (레전드·크로스 판정용)
  let maLines = new Map();      // key → [{time, value}] 계산 결과 전체
  // 200주선 계산용 주봉 캐시. 종목마다 값이 다르므로 종목별로 따로 담는다.
  const weeklyCache = new Map();      // 종목키 → 주봉 배열
  const weeklyFailed = new Set();     // 조회 실패한 종목키 (재시도 폭주 방지)
  const weeklyBarsOf = () => weeklyCache.get(coin.key) || null;

  // 단순이동평균: period개 종가의 평균
  function calcSMA(bars, period) {
    const out = [];
    if (bars.length < period) return out;
    let sum = 0;
    for (let i = 0; i < bars.length; i++) {
      sum += bars[i].close;
      if (i >= period) sum -= bars[i - period].close;
      if (i >= period - 1) out.push({ time: bars[i].time, value: sum / period });
    }
    return out;
  }
  // 지수이동평균: 앞 period개의 단순평균을 초기값으로 삼는 표준 방식
  function calcEMA(bars, period) {
    const out = [];
    if (bars.length < period) return out;
    const k = 2 / (period + 1);
    let seed = 0;
    for (let i = 0; i < period; i++) seed += bars[i].close;
    let prev = seed / period;
    out.push({ time: bars[period - 1].time, value: prev });
    for (let i = period; i < bars.length; i++) {
      prev = bars[i].close * k + prev * (1 - k);
      out.push({ time: bars[i].time, value: prev });
    }
    return out;
  }

  // 주봉 기준 200주 SMA를 일봉 시간축으로 옮긴다.
  // 주 단위 계단이 생기지 않도록 인접한 두 주값 사이를 선형 보간한다.
  function mapWeeklyToDaily(weeklySMA, dailyBars) {
    if (!weeklySMA.length || !dailyBars.length) return [];
    const out = [];
    let j = 0;
    for (const b of dailyBars) {
      while (j < weeklySMA.length - 1 && weeklySMA[j + 1].time <= b.time) j++;
      const cur = weeklySMA[j];
      if (b.time < cur.time) continue;             // 200주선이 아직 시작되지 않은 구간
      const nxt = weeklySMA[j + 1];
      if (!nxt) { out.push({ time: b.time, value: cur.value }); continue; }
      const span = nxt.time - cur.time;
      const f = span > 0 ? (b.time - cur.time) / span : 0;
      out.push({ time: b.time, value: cur.value + (nxt.value - cur.value) * f });
    }
    return out;
  }

  // 일봉에서 200주선을 그리기 위한 주봉 데이터 (최초 1회만 호출)
  async function ensureWeeklyBars() {
    const ck = coin.key;
    if (weeklyCache.has(ck) || weeklyFailed.has(ck)) return weeklyCache.get(ck) || null;
    const path = `/klines?symbol=${coin.symbol}&interval=1w&limit=520`;
    for (let n = 0; n < REST_HOSTS.length; n++) {
      const idx = (restIdx + n) % REST_HOSTS.length;
      try {
        const res = await fetch(REST_HOSTS[idx] + path, { signal: AbortSignal.timeout(7000) });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const raw = await res.json();
        const wb = raw.map(klineToBar);
        weeklyCache.set(ck, wb);
        return wb;
      } catch {}
    }
    weeklyFailed.add(ck);       // 실패해도 나머지 이평선은 정상 표시
    return null;
  }

  function clearMAs() {
    for (const s of maSeries.values()) { try { chart.removeSeries(s); } catch {} }
    maSeries.clear();
    maValues.clear();
    maLines.clear();
    $("ma-legend").innerHTML = "";
  }

  // 현재 시간봉에서 쓸 이평선 목록 (200주선은 데이터가 확보된 경우만)
  function activeMaDefs() {
    if (!MA_TIMEFRAMES.has(current.key)) return [];
    return MA_DEFS.filter(d => {
      if (!d.weeklySource) return true;
      // 주봉 차트에서는 자기 데이터가 곧 주봉이므로 별도 확보가 필요 없다
      if (current.key === "1w") return true;
      return !!weeklyBarsOf();
    });
  }

  function computeMaLine(def, bars) {
    if (def.weeklySource && current.key === "1d") {
      if (!weeklyBarsOf()) return [];
      // 진행 중인 주의 종가는 캐시된 주봉에 아직 반영되지 않았으므로
      // 최신 일봉 종가로 보정해 200주선의 현재값을 정확히 맞춘다.
      let wb = weeklyBarsOf();
      const lastDaily = bars[bars.length - 1];
      const lastWeek = wb[wb.length - 1];
      if (lastDaily && lastWeek && lastDaily.time >= lastWeek.time &&
          lastDaily.close !== lastWeek.close) {
        wb = wb.slice(0, -1).concat([{ ...lastWeek, close: lastDaily.close }]);
      }
      return mapWeeklyToDaily(calcSMA(wb, def.period), bars);
    }
    return def.type === "ema" ? calcEMA(bars, def.period) : calcSMA(bars, def.period);
  }

  // 50 EMA와 200 EMA의 최근 교차를 찾아 현재 국면과 경과 봉 수를 알려준다
  function detectCross() {
    const fast = maLines.get("ema50"), slow = maLines.get("ema200");
    if (!fast || !slow || !fast.length || !slow.length) return null;
    const slowMap = new Map(slow.map(p => [p.time, p.value]));
    const pairs = [];
    for (const p of fast) {
      const s = slowMap.get(p.time);
      if (s != null) pairs.push({ time: p.time, diff: p.value - s });
    }
    if (pairs.length < 2) return null;
    const nowUp = pairs[pairs.length - 1].diff > 0;
    let crossIdx = -1;
    for (let i = pairs.length - 1; i > 0; i--) {
      const a = pairs[i - 1].diff, b = pairs[i].diff;
      if ((a <= 0 && b > 0) || (a >= 0 && b < 0)) { crossIdx = i; break; }
    }
    return {
      golden: nowUp,
      barsAgo: crossIdx < 0 ? null : pairs.length - 1 - crossIdx,
    };
  }

  function renderMaLegend() {
    const box = $("ma-legend");
    box.innerHTML = "";
    const defs = activeMaDefs();
    if (!defs.length) return;
    const price = barsArr.length ? barsArr[barsArr.length - 1].close : 0;

    for (const def of defs) {
      const v = maValues.get(def.key);
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip" + (maVisible[def.key] ? "" : " off");
      chip.setAttribute("aria-pressed", String(!!maVisible[def.key]));
      chip.title = `${def.role} · ${def.label}` +
        (def.weeklySource ? " (200주 단순평균)" : "");

      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = def.color;
      chip.appendChild(dot);

      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = def.label;
      chip.appendChild(nm);

      const val = document.createElement("span");
      val.className = "val";
      val.textContent = v != null ? fmtPrice(v) : "—";
      chip.appendChild(val);

      if (v != null && price > 0) {
        const dev = ((price - v) / v) * 100;
        const el = document.createElement("span");
        el.className = "dev " + (dev >= 0 ? "up" : "down");
        el.textContent = (dev >= 0 ? "+" : "") + dev.toFixed(1) + "%";
        chip.appendChild(el);
      }

      chip.addEventListener("click", () => {
        maVisible[def.key] = !maVisible[def.key];
        saveMaState();
        const s = maSeries.get(def.key);
        if (s) s.applyOptions({ visible: maVisible[def.key] });
        chip.classList.toggle("off", !maVisible[def.key]);
        chip.setAttribute("aria-pressed", String(maVisible[def.key]));
      });
      box.appendChild(chip);
    }

    const cross = detectCross();
    if (cross) {
      const badge = document.createElement("span");
      badge.className = "cross " + (cross.golden ? "golden" : "dead");
      const unit = current.key === "1w" ? "주" : "일";
      badge.innerHTML = (cross.golden ? "골든크로스" : "데드크로스") +
        (cross.barsAgo != null
          ? ` <span class="ago">${cross.barsAgo}${unit} 전</span>`
          : ` <span class="ago">유지</span>`);
      badge.title = "50 EMA와 200 EMA의 최근 교차";
      box.appendChild(badge);
    }
  }

  // 이평선 전체 재계산 및 렌더 (시간봉 로드·봉 마감 시)
  function renderMAs(bars) {
    clearMAs();
    if (!MA_TIMEFRAMES.has(current.key) || !bars.length) return;
    for (const def of activeMaDefs()) {
      const data = computeMaLine(def, bars);
      if (!data.length) continue;
      const s = chart.addLineSeries({
        color: def.color,
        lineWidth: def.width,
        priceLineVisible: false,
        lastValueVisible: false,      // 우측 축 혼잡을 막고 값은 레전드에 표시
        crosshairMarkerVisible: false,
        visible: !!maVisible[def.key],
      });
      s.setData(data);
      maSeries.set(def.key, s);
      maLines.set(def.key, data);
      maValues.set(def.key, data[data.length - 1].value);
    }
    renderMaLegend();
  }

  // 틱마다 마지막 점만 갱신 (전체 setData는 비싸므로 update로 처리)
  let maTickRaf = 0;
  function updateMAsLive() {
    if (!maSeries.size || !barsArr.length) return;
    if (maTickRaf) return;
    maTickRaf = requestAnimationFrame(() => {
      maTickRaf = 0;
      const bars = barsArr;
      if (!bars.length) return;
      const lastBar = bars[bars.length - 1];
      for (const [key, s] of maSeries) {
        const def = MA_DEFS.find(d => d.key === key);
        if (!def) continue;
        // 200주선은 주봉이 마감될 때만 의미 있게 변하므로 틱 갱신에서 제외
        if (def.weeklySource && current.key === "1d") continue;
        const data = computeMaLine(def, bars);
        if (!data.length) continue;
        const last = data[data.length - 1];
        if (last.time !== lastBar.time) continue;
        try { s.update(last); } catch {}
        maLines.set(key, data);
        maValues.set(key, last.value);
      }
      renderMaLegend();
    });
  }

  // ── 종목 바 렌더링 ──
  const coinNav = $("coins");
  SYMBOLS.forEach(c => {
    const b = document.createElement("button");
    b.dataset.key = c.key;
    b.style.setProperty("--cc", c.color);
    const m = document.createElement("span");
    m.className = "cm";
    m.style.background = c.color;
    m.textContent = c.mark;
    b.appendChild(m);
    b.appendChild(document.createTextNode(c.key));
    b.title = c.name;
    if (c.key === coin.key) b.classList.add("active");
    b.addEventListener("click", () => switchCoin(c));
    coinNav.appendChild(b);
  });

  // 헤더·워터마크·거래량 단위를 현재 종목에 맞춘다
  function applyCoinChrome() {
    const mark = $("coin-mark");
    mark.textContent = coin.mark;
    mark.style.background = coin.color;
    $("coin-name").textContent = coin.name;
    $("coin-pair").textContent = coin.key + "/USDT · Binance";

  // ══════════════════════════════════════════════════════════
  //  화면 상태 기억 — 종목·시간봉마다 "보고 있던 화면"을 그대로 되살린다.
  //  이전에는 불러올 때마다 전체 구간에 맞춰버려서 종목을 옮길 때마다
  //  확대와 위치를 다시 잡아야 했다. 이제 가로(확대·이동)는 물론
  //  가격축을 손으로 조정한 경우 세로 범위까지 함께 복원한다.
  // ══════════════════════════════════════════════════════════
  const VIEW_KEY = "coinchart_view_v1";
  let viewStore = {};
  try { viewStore = JSON.parse(localStorage.getItem(VIEW_KEY)) || {}; } catch {}
  const viewKeyFor = (tfKey, coinKey) => (coinKey || coin.key) + ":" + tfKey;

  function captureView() {
    try {
      const lr = chart.timeScale().getVisibleLogicalRange();
      if (!lr) return null;
      const ps = candles.priceScale();
      // autoScale이 꺼져 있다 = 사용자가 가격축을 직접 조정했다는 뜻
      const manual = ps.options().autoScale === false;
      const v = { from: lr.from, to: lr.to, manual };
      if (manual) {
        const h = chart.paneSize().height;
        const top = candles.coordinateToPrice(0);
        const bot = candles.coordinateToPrice(h);
        if (Number.isFinite(top) && Number.isFinite(bot) && top !== bot) {
          v.max = Math.max(top, bot);
          v.min = Math.min(top, bot);
        } else v.manual = false;
      }
      return v;
    } catch { return null; }
  }

  function saveViewNow() {
    const v = captureView();
    if (!v) return;
    viewStore[viewKeyFor(current.key)] = v;
    try { localStorage.setItem(VIEW_KEY, JSON.stringify(viewStore)); } catch {}
  }
  let viewSaveTimer = 0;
  function scheduleSaveView() {
    clearTimeout(viewSaveTimer);
    viewSaveTimer = setTimeout(saveViewNow, 400);   // 조작이 멈춘 뒤에만 저장
  }

  // 저장된 화면이 있으면 복원하고, 없으면 전체 구간에 맞춘다.
  function restoreView(tfKey) {
    const v = viewStore[viewKeyFor(tfKey)];
    const ts = chart.timeScale();
    const ps = candles.priceScale();
    if (!v || !Number.isFinite(v.from) || !Number.isFinite(v.to) || v.to <= v.from) {
      ps.applyOptions({ autoScale: true });
      ts.fitContent();
      return false;
    }
    if (v.manual && Number.isFinite(v.min) && Number.isFinite(v.max)) {
      // 세로 범위 복원: 저장 범위를 잠시 강제한 뒤 수동 모드로 고정하고 훅을 푼다.
      // 이렇게 해야 복원 직후부터 사용자가 다시 자유롭게 조정할 수 있다.
      pinnedPriceRange = { min: v.min, max: v.max };
      ps.applyOptions({ autoScale: true });
      try { ts.setVisibleLogicalRange({ from: v.from, to: v.to }); } catch {}
      requestAnimationFrame(() => {
        ps.applyOptions({ autoScale: false });
        pinnedPriceRange = null;
      });
    } else {
      ps.applyOptions({ autoScale: true });
      try { ts.setVisibleLogicalRange({ from: v.from, to: v.to }); } catch {}
    }
    return true;
  }

  // ── 탭 렌더링 ──
  const nav = $("tabs");
  TIMEFRAMES.forEach(tf => {
    const b = document.createElement("button");
    b.textContent = tf.label;
    b.dataset.key = tf.key;
    if (tf.key === current.key) b.classList.add("active");
    b.addEventListener("click", () => switchTimeframe(tf));
    nav.appendChild(b);
  });

  const tools = $("tools");
  const grpAuto = document.createElement("div");
  grpAuto.className = "tool-group auto";
  tools.appendChild(grpAuto);
  const lblAuto = document.createElement("span");
  lblAuto.className = "grp-label";
  lblAuto.textContent = "자동 분석";
  grpAuto.appendChild(lblAuto);

  const btnSR = document.createElement("button");
  btnSR.className = "toggle on-sr";
  btnSR.textContent = "지지·저항";
  btnSR.setAttribute("aria-pressed", "true");
  btnSR.addEventListener("click", () => {

  // ══════════════════════════════════════════════════════════
  //  RSI(14) 보조 지표 + RSI 추세선 + 다이버전스 탐지
  //  · 별도의 차트 인스턴스를 아래에 두고 가로 축(로지컬 범위)을 양방향 동기화한다.
  //    lightweight-charts 4.x에는 패널(pane) 기능이 없어 이 방식이 유일한 해법이다.
  //  · 인덱스가 어긋나면 두 창의 봉이 따로 놀기 때문에, 계산이 불가능한 앞쪽
  //    14봉은 값 없는 whitespace 점으로 채워 넣어 봉 번호를 정확히 맞춘다.
  //  · 다이버전스는 "가격의 스윙"과 "그 시점 RSI"를 비교한다. RSI 자체의 스윙을
  //    쓰면 가격과 다른 지점을 짚어 실제와 어긋나므로 반드시 가격 기준으로 잡는다.
  // ══════════════════════════════════════════════════════════
  const RSI_DEFAULT_PERIOD = 14;
  const RSI_MIN_PERIOD = 2, RSI_MAX_PERIOD = 50;
  const RSI_KEY = "btcchart_rsi_on";
  const RSI_PERIOD_KEY = "btcchart_rsi_period";
  const RSI_HEIGHT_KEY = "btcchart_rsi_height";
  // 기본 높이: 화면 세로의 38% (200~340px). 작은 화면에서도 과매수/과매도 구간이
  // 눈에 들어오려면 이 정도는 필요하다. 저장된 값이 있으면 그쪽이 우선한다.
  const rsiDefaultHeight = () =>
    Math.max(200, Math.min(340, Math.round(window.innerHeight * 0.38)));
  const RSI_COLOR = "#e879f9";
  const DIV_BEAR = "#f43f5e";   // 약세(하락) 다이버전스
  const DIV_BULL = "#14b8a6";   // 강세(상승) 다이버전스

  let showRSI = false;
  let rsiPeriod = RSI_DEFAULT_PERIOD;
  try {
    showRSI = localStorage.getItem(RSI_KEY) === "1";
    const p = parseInt(localStorage.getItem(RSI_PERIOD_KEY), 10);
    if (Number.isFinite(p) && p >= RSI_MIN_PERIOD && p <= RSI_MAX_PERIOD) rsiPeriod = p;
  } catch {}

  let rsiChart = null, rsiSeries = null;
  let rsiBandHi = null, rsiBandLo = null;   // 과매수/과매도 구간 음영
  let rsiTrendSeries = [];    // RSI 창의 자동 추세선
  let rsiDivSeries = [];      // RSI 창의 다이버전스 연결선
  let priceDivSeries = [];    // 가격 창의 다이버전스 연결선
  let rsiLast = null;         // 마지막 RSI 값
  let lastRSI = null;         // 마지막 RSI 분석 결과 (값·추세선·다이버전스)
  let rsiSyncing = false;

  // 와일더 방식 RSI. 첫 구간은 단순평균, 이후는 지수 평활(1/period).
  function calcRSI(bars, period) {
    const out = [];
    if (bars.length < period + 1) return out;
    let ag = 0, al = 0;
    for (let i = 1; i <= period; i++) {
      const d = bars[i].close - bars[i - 1].close;
      if (d >= 0) ag += d; else al -= d;
    }
    ag /= period; al /= period;
    const val = () => al === 0 ? 100 : ag === 0 ? 0 : 100 - 100 / (1 + ag / al);
    out.push({ i: period, time: bars[period].time, value: val() });
    for (let i = period + 1; i < bars.length; i++) {
      const d = bars[i].close - bars[i - 1].close;
      ag = (ag * (period - 1) + (d > 0 ? d : 0)) / period;
      al = (al * (period - 1) + (d < 0 ? -d : 0)) / period;
      out.push({ i, time: bars[i].time, value: val() });
    }
    return out;
  }

  // RSI 창 생성 (처음 켤 때 1회)
  function ensureRSIChart() {
    if (rsiChart) return rsiChart;
    rsiChart = LightweightCharts.createChart($("rsi"), {
      layout: {
        background: { type: "solid", color: "#0c0e14" },
        textColor: "#8b93a7",
        fontFamily: "'SF Mono', Consolas, monospace",
        fontSize: 10,
      },
      grid: {
        vertLines: { color: "rgba(35,40,56,.35)" },
        horzLines: { color: "rgba(35,40,56,.25)" },
      },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
        vertLine: { color: "#8b93a7", width: 1, style: 2, labelVisible: false },
        horzLine: { color: "#8b93a7", width: 1, style: 2, labelBackgroundColor: "#232838" },
      },
      // 시간축은 위 차트의 것을 공유한다 (중복 표시로 세로 공간을 낭비하지 않음)
      timeScale: { visible: false, borderVisible: false, rightOffset: 4 },
      rightPriceScale: { borderColor: "#232838", scaleMargins: { top: 0.12, bottom: 0.12 } },
      localization: { priceFormatter: v => v.toFixed(1) },
      // 오른쪽 축을 위아래로 끌면 RSI 간격이 벌어지고 좁혀진다 (위 캔들 차트와 동일).
      // 축을 두 번 누르면 기본 0~100 자동 스케일로 되돌아간다.
      handleScale: {
        axisPressedMouseMove: { price: true, time: true },
        axisDoubleClickReset: { price: true, time: true },
      },
      handleScroll: { vertTouchDrag: true, horzTouchDrag: true,
                      pressedMouseMove: true, mouseWheel: true },
    });

    // ── 과매수(70↑) / 과매도(30↓) 구간 음영 ──
    // 기준선을 base로 삼는 baseline 시리즈를 깔아 두면 축을 늘리거나 줄여도
    // 음영이 저절로 따라온다. 좌표를 직접 계산해 덧그리면 축을 조절할 때마다
    // 어긋나므로 이 방식이 안전하다.
    const CLEAR = "rgba(0,0,0,0)";
    rsiBandHi = rsiChart.addBaselineSeries({
      baseValue: { type: "price", price: 70 },
      topFillColor1: "rgba(244,63,94,.3)",    // 100 쪽이 진하고
      topFillColor2: "rgba(244,63,94,.05)",   // 70 쪽으로 갈수록 옅어진다
      topLineColor: CLEAR, bottomLineColor: CLEAR,
      bottomFillColor1: CLEAR, bottomFillColor2: CLEAR,
      lineWidth: 1, priceLineVisible: false, lastValueVisible: false,
      crosshairMarkerVisible: false,
      autoscaleInfoProvider: () => null,      // 눈금 계산에는 관여하지 않는다
    });
    rsiBandLo = rsiChart.addBaselineSeries({
      baseValue: { type: "price", price: 30 },
      bottomFillColor1: "rgba(34,211,238,.05)",
      bottomFillColor2: "rgba(34,211,238,.3)",
      topLineColor: CLEAR, bottomLineColor: CLEAR,
      topFillColor1: CLEAR, topFillColor2: CLEAR,
      lineWidth: 1, priceLineVisible: false, lastValueVisible: false,
      crosshairMarkerVisible: false,
      autoscaleInfoProvider: () => null,
    });

    rsiSeries = rsiChart.addLineSeries({
      color: RSI_COLOR, lineWidth: 2,
      priceLineVisible: false, lastValueVisible: true,
      crosshairMarkerVisible: true,
      priceFormat: { type: "price", precision: 1, minMove: 0.1 },
      // 0~100 고정: 눈금이 구간마다 달라지면 과매수/과매도 위치가 흔들린다.
      // 단 이 값은 "자동 스케일" 상태에서만 쓰인다. 사용자가 오른쪽 축을 끌어
      // 간격을 조절하면 라이브러리가 자동 스케일을 꺼서 그 범위가 그대로 유지된다.
      autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }),
    });

    [
      { price: 70, color: "rgba(244,63,94,.7)", title: "70" },
      { price: 50, color: "rgba(139,147,167,.35)", title: "50" },
      { price: 30, color: "rgba(34,211,238,.7)", title: "30" },
    ].forEach(l => rsiSeries.createPriceLine({
      price: l.price, color: l.color, lineWidth: 1,
      lineStyle: l.price === 50 ? LightweightCharts.LineStyle.Dotted
                                : LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: l.title,
    }));

    // 가로 축 양방향 동기화 (재귀 호출 방지 플래그 필수)
    chart.timeScale().subscribeVisibleLogicalRangeChange(r => {
      if (!r || rsiSyncing || !rsiChart) return;
      rsiSyncing = true;
      try { rsiChart.timeScale().setVisibleLogicalRange(r); } catch {}
      rsiSyncing = false;
    });
    rsiChart.timeScale().subscribeVisibleLogicalRangeChange(r => {
      if (!r || rsiSyncing) return;
      rsiSyncing = true;
      try { chart.timeScale().setVisibleLogicalRange(r); } catch {}
      rsiSyncing = false;
    });

    let rW = 0, rH = 0, rRaf = 0;
    new ResizeObserver(() => {
      const el = $("rsi");   // 손잡이 높이를 뺀 실제 차트 영역
      const w = el.clientWidth, h = el.clientHeight;
      if ((w === rW && h === rH) || !w || !h) return;
      rW = w; rH = h;
      if (rRaf) return;
      rRaf = requestAnimationFrame(() => {
        rRaf = 0;
        rsiChart.applyOptions({ width: w, height: h });
        syncScaleWidth();
      });
    }).observe($("rsi"));

    return rsiChart;
  }

  // 두 창의 가격축 폭을 맞춰야 세로선이 어긋나지 않는다.
  // RSI는 두 자리 숫자라 축이 좁으므로 위 차트의 폭을 최소값으로 지정한다.
  function syncScaleWidth() {
    if (!rsiChart) return;
    try {
      const w = chart.priceScale("right").width();
      if (w > 0) rsiChart.priceScale("right").applyOptions({ minimumWidth: w });
    } catch {}
  }

  function clearRSIOverlays() {
    rsiTrendSeries.forEach(s => { try { rsiChart.removeSeries(s); } catch {} });
    rsiTrendSeries = [];
    rsiDivSeries.forEach(s => { try { rsiChart.removeSeries(s); } catch {} });
    rsiDivSeries = [];
    clearPriceDivLines();
  }
  function clearPriceDivLines() {
    priceDivSeries.forEach(s => { try { chart.removeSeries(s); } catch {} });
    priceDivSeries = [];
  }

  // RSI 값 위에서 스윙 고점/저점 찾기 (가격 스윙 판정과 같은 방식)
  function rsiPivots(pts, width) {
    const highs = [], lows = [];
    for (let k = width; k < pts.length - width; k++) {
      let isH = true, isL = true;
      for (let j = k - width; j <= k + width; j++) {
        if (j === k) continue;
        if (pts[j].value >= pts[k].value) isH = false;
        if (pts[j].value <= pts[k].value) isL = false;
        if (!isH && !isL) break;
      }
      if (isH) highs.push(pts[k]);
      if (isL) lows.push(pts[k]);
    }
    return { highs, lows };
  }

  // RSI 추세선: 형성 구간을 관통하지 않는 선만 채택한다.
  // 가격 추세선과 같은 철학 — 없는 추세를 그려 보여주는 것보다 생략이 안전하다.
  // 형성 구간 이후(연장부)의 돌파는 역할 전환이므로 허용한다.
  function rsiTrendline(pivots, pts, type, tol) {
    if (pivots.length < 2 || !pts.length) return null;
    const cand = pivots.slice(-6);
    const lastI = pts[pts.length - 1].i;
    const newestI = cand[cand.length - 1].i;
    let best = null;
    for (let a = 0; a < cand.length - 1; a++) {
      for (let b = a + 1; b < cand.length; b++) {
        const P = cand[a], Q = cand[b];
        const span = Q.i - P.i;
        if (span < 6) continue;
        const slope = (Q.value - P.value) / span;
        let ok = true, touches = 0;
        for (const p of pts) {
          if (p.i < P.i || p.i > Q.i) continue;
          const lv = P.value + slope * (p.i - P.i);
          const over = type === "res" ? p.value - lv : lv - p.value;
          if (over > tol) { ok = false; break; }
          if (Math.abs(p.value - lv) <= tol) touches++;
        }
        if (!ok) continue;
        // 최근 스윙을 끝점으로 쓰는 선에 가산점 — 지금 유효한 추세를 우선한다
        const score = touches * 2 + span * 0.04 + (Q.i === newestI ? 5 : 0);
        if (!best || score > best.score) best = { P, Q, slope, touches, score };
      }
    }
    if (!best) return null;
    // 0/100을 벗어나기 직전에서 끊는다 (화면 밖으로 뻗어나가면 읽을 수 없다)
    let endI = lastI;
    for (let i = best.Q.i; i <= lastI; i++) {
      const v = best.P.value + best.slope * (i - best.P.i);
      if (v < 2 || v > 98) { endI = i; break; }
    }
    const endVal = best.P.value + best.slope * (endI - best.P.i);
    const nowVal = best.P.value + best.slope * (lastI - best.P.i);
    return { P: best.P, endI, endVal, nowVal, slope: best.slope, touches: best.touches };
  }

  // 가격 스윙과 그 시점 RSI를 비교해 다이버전스를 찾는다.
  //  · 일반(regular): 추세 소진 신호  · 히든(hidden): 추세 지속 신호
  //  · 마지막 스윙이 충분히 최근일 때만 인정한다 (오래된 신호는 이미 소화됨)
  function findDivergence(bars, pts, width) {
    if (pts.length < 10 || bars.length < 30) return null;
    const rmap = new Map(pts.map(p => [p.i, p.value]));
    const { highs, lows } = detectPivots(bars, width);
    const lastIdx = bars.length - 1;
    const freshWin = Math.max(10, width * 5);
    const maxGap = 90, minGap = 5;
    const found = [];

    // 구간 극단값 — 두 스윙 중 하나는 최근 구간의 꼭짓점이어야 신호로 인정한다.
    // 이 조건이 없으면 횡보 구간의 자잘한 봉우리끼리 엮여 다이버전스가 남발된다.
    const win = bars.slice(-Math.min(bars.length, maxGap + freshWin));
    const winMax = Math.max(...win.map(b => b.high));
    const winMin = Math.min(...win.map(b => b.low));
    // 최근 40봉 기준 추세 방향 (히든 다이버전스 판정용)
    const ref = bars[Math.max(0, lastIdx - 40)].close;
    const trend = (bars[lastIdx].close - ref) / ref;

    const scan = (piv, kind) => {
      const cand = piv.slice(-5);
      for (let a = 0; a < cand.length - 1; a++) {
        for (let b = a + 1; b < cand.length; b++) {
          const A = cand[a], B = cand[b];
          const gap = B.i - A.i;
          if (gap < minGap || gap > maxGap) continue;
          if (lastIdx - B.i > freshWin) continue;          // 신선도
          // 일반형은 "구간의 꼭짓점"에서만 의미가 있다 (추세 소진 신호이므로).
          // 히든형은 추세 한가운데서 나오는 지속 신호라 이 조건을 쓸 수 없어,
          // 대신 실제로 그 방향의 추세가 진행 중인지를 따로 확인한다.
          const extreme = kind === "high"
            ? Math.max(A.price, B.price) >= winMax * 0.985
            : Math.min(A.price, B.price) <= winMin * 1.015;
          const rA = rmap.get(A.i), rB = rmap.get(B.i);
          if (rA == null || rB == null) continue;
          const dR = rB - rA;
          const dP = (B.price - A.price) / A.price;
          if (Math.abs(dP) < 0.008) continue;               // 가격 차이가 미미하면 무시
          const reg = extreme && Math.abs(dR) >= 4;         // 일반형: 꼭짓점 + 최소 괴리
          const hid = Math.abs(dR) >= 6 &&                  // 히든형: 큰 괴리 + 추세 확인
            (kind === "high" ? trend < -0.01 : trend > 0.01);
          if (kind === "high") {
            if (dP > 0 && dR < 0 && rA >= 60 && reg)
              found.push({ cls: "bear", regular: true, A, B, rA, rB, gap,
                label: "하락(약세) 다이버전스", desc: "가격 고점 ↑ / RSI 고점 ↓" });
            if (dP < 0 && dR > 0 && hid)
              found.push({ cls: "bear", regular: false, A, B, rA, rB, gap,
                label: "히든 약세 다이버전스", desc: "가격 고점 ↓ / RSI 고점 ↑ (하락 지속)" });
          } else {
            if (dP < 0 && dR > 0 && rA <= 40 && reg)
              found.push({ cls: "bull", regular: true, A, B, rA, rB, gap,
                label: "상승(강세) 다이버전스", desc: "가격 저점 ↓ / RSI 저점 ↑" });
            if (dP > 0 && dR < 0 && hid)
              found.push({ cls: "bull", regular: false, A, B, rA, rB, gap,
                label: "히든 강세 다이버전스", desc: "가격 저점 ↑ / RSI 저점 ↓ (상승 지속)" });
          }
        }
      }
    };
    scan(highs, "high");
    scan(lows, "low");
    if (!found.length) return null;
    // 일반형 우선 → RSI 괴리가 큰 것 → 더 최근 것
    found.sort((x, y) =>
      (y.regular - x.regular) ||
      (Math.abs(y.rB - y.rA) - Math.abs(x.rB - x.rA)) ||
      (y.B.i - x.B.i));
    return found[0];
  }

  // 기간 조절 컨트롤 (− / 숫자 / +). 숫자를 누르면 기본값 14로 되돌린다.
  function perHTML() {
    return `<span class="nm">RSI</span>` +
      `<span class="per">` +
        `<button data-per="-" aria-label="기간 줄이기">−</button>` +
        `<b data-per="reset" title="눌러서 기본값(${RSI_DEFAULT_PERIOD})으로">${rsiPeriod}</b>` +
        `<button data-per="+" aria-label="기간 늘리기">+</button>` +
      `</span>` +
      `<button class="guide" data-guide="1">쉬운 설명</button>` +
      `<button class="guide ai" data-ai="1">AI 분석</button>`;
  }

  // 컨트롤은 매 렌더마다 다시 그려지므로 위임 방식으로 한 번만 연결한다
  $("rsi-info").addEventListener("click", e => {
    if (e.target.closest("[data-guide]")) { showRSIGuide(); return; }
    if (e.target.closest("[data-ai]")) { showRSIAI(); return; }
    const el = e.target.closest("[data-per]");
    if (!el) return;
    const act = el.dataset.per;
    let v = act === "reset" ? RSI_DEFAULT_PERIOD
          : rsiPeriod + (act === "+" ? 1 : -1);
    v = Math.max(RSI_MIN_PERIOD, Math.min(RSI_MAX_PERIOD, v));
    if (v === rsiPeriod) return;
    rsiPeriod = v;
    try { localStorage.setItem(RSI_PERIOD_KEY, String(v)); } catch {}
    runRSI(barsArr);   // 기간이 바뀌면 추세선·다이버전스도 함께 다시 잡는다
  });

  // ── 창 높이 조절 ──
  // 손잡이를 위아래로 끌면 RSI 창이 늘어나고 위 차트가 그만큼 줄어든다.
  // 화면이 다 잡아먹히지 않도록 최소 70px, 최대 화면의 65%로 제한한다.
  function clampRSIHeight(h) {
    // 위 차트가 뭉개지지 않도록 최소 140px는 남겨 둔다.
    // 두 창의 높이 합은 드래그 중에도 일정하므로 여기서 남은 공간을 계산할 수 있다.
    const wrapH = $("rsi-wrap").getBoundingClientRect().height;
    const chartH = $("chart-wrap").getBoundingClientRect().height;
    const room = wrapH + chartH - 140;
    const max = Math.max(120, Math.min(Math.round(window.innerHeight * 0.75), Math.round(room)));
    return Math.max(100, Math.min(max, Math.round(h)));
  }
  function applyRSIHeight(h) {
    $("rsi-wrap").style.height = clampRSIHeight(h) + "px";
  }
  (() => {
    let savedH = NaN;
    try { savedH = parseInt(localStorage.getItem(RSI_HEIGHT_KEY), 10); } catch {}
    applyRSIHeight(Number.isFinite(savedH) ? savedH : rsiDefaultHeight());
  })();
  (() => {
    const grip = $("rsi-grip");
    const hint = grip.querySelector(".hint");
    let startY = 0, startH = 0, active = false, lastTap = 0, moved = false;

    const begin = y => {
      active = true;
      startY = y;
      startH = $("rsi-wrap").getBoundingClientRect().height;
      moved = false;
      grip.classList.add("drag");
    };
    const move = y => {
      if (!active) return;
      if (Math.abs(y - startY) > 2) moved = true;
      applyRSIHeight(startH - (y - startY));   // 위로 끌면 커진다
      hint.textContent = Math.round($("rsi-wrap").getBoundingClientRect().height) + "px";
    };
    const end = () => {
      if (!active) return;
      active = false;
      grip.classList.remove("drag");
      hint.textContent = "";
      try {
        localStorage.setItem(RSI_HEIGHT_KEY,
          String(Math.round($("rsi-wrap").getBoundingClientRect().height)));
      } catch {}
      scheduleHandles();   // 위 차트가 줄었으므로 그린 선의 조작 핸들 위치 재계산
    };
    const reset = () => {
      applyRSIHeight(rsiDefaultHeight());
      try { localStorage.setItem(RSI_HEIGHT_KEY, String(rsiDefaultHeight())); } catch {}
      scheduleHandles();
    };

    // 이동·종료는 문서 전체에서 받는다.
    // setPointerCapture가 동작하지 않는 브라우저(구형 iOS 등)에서도 손가락이
    // 손잡이 밖으로 나가는 순간 드래그가 끊기지 않도록 하기 위한 안전장치다.
    // 포인터와 터치 이벤트를 모두 걸어 두되, 같은 좌표로 같은 계산을 하므로
    // 두 이벤트가 함께 들어와도 결과는 달라지지 않는다.
    const startFrom = y => { begin(y); };

    grip.addEventListener("pointerdown", e => {
      startFrom(e.clientY);
      try { grip.setPointerCapture(e.pointerId); } catch {}
      e.preventDefault();
    });
    grip.addEventListener("touchstart", e => {
      if (!e.touches[0]) return;
      startFrom(e.touches[0].clientY);
      e.preventDefault();
    }, { passive: false });
    grip.addEventListener("mousedown", e => { startFrom(e.clientY); e.preventDefault(); });

    document.addEventListener("pointermove", e => {
      if (!active) return;
      move(e.clientY);
      e.preventDefault();
    }, { passive: false });
    document.addEventListener("touchmove", e => {
      if (!active || !e.touches[0]) return;
      move(e.touches[0].clientY);
      e.preventDefault();        // 창을 끄는 동안 페이지가 함께 밀리지 않게
    }, { passive: false });
    document.addEventListener("mousemove", e => { if (active) move(e.clientY); });

    ["pointerup", "pointercancel", "touchend", "touchcancel", "mouseup"]
      .forEach(ev => document.addEventListener(ev, end));

    // 두 번 누르면 기본 높이로 (모바일은 dblclick이 안 오는 경우가 있어 직접 판정)
    grip.addEventListener("dblclick", reset);
    grip.addEventListener("pointerup", () => {
      if (moved) { lastTap = 0; return; }   // 끌었던 동작은 탭으로 세지 않는다
      const now = Date.now();
      if (now - lastTap < 320) { reset(); lastTap = 0; } else lastTap = now;
    });

    // 화면 회전·창 크기 변경 시 한도를 다시 적용 (위 차트가 사라지는 것을 방지)
    window.addEventListener("resize", () => {
      if (!showRSI) return;
      applyRSIHeight($("rsi-wrap").getBoundingClientRect().height);
    });
  })();

  // ── 초보 투자자용 RSI 설명 ──
  // 지금 화면의 실제 숫자를 넣어 설명한다. 일반론만 늘어놓으면 읽어도 자기 차트와
  // 연결이 안 되기 때문이다. 매수/매도 지시는 하지 않고, 흔한 오해를 먼저 짚는다.
  function rsiZoneGuide(v) {
    if (v >= 70) return [
      `지금 RSI는 ${v.toFixed(1)}입니다. 흔히 "과매수"라고 부르는 70 위 구간입니다.`,
      `여기서 가장 흔한 오해가 "과매수 = 곧 떨어진다"입니다. 그렇지 않습니다.`,
      `강한 상승장에서는 RSI가 70 위에 몇 주씩 머무는 일이 아주 흔합니다.`,
      `70을 넘었다는 것은 "많이, 빠르게 올랐다"는 사실의 확인이지 하락 예고가 아닙니다.`,
      `오히려 70 위에 있다가 70 아래로 다시 내려오는 순간이 상승의 힘이 꺾이는 신호에 가깝습니다.`,
    ];
    if (v >= 50) return [
      `지금 RSI는 ${v.toFixed(1)}입니다. 50과 70 사이, 오르는 쪽에 힘이 조금 더 실려 있는 구간입니다.`,
      `RSI에서 50은 "오른 폭과 내린 폭이 비슷하다"는 뜻의 중간선입니다.`,
      `상승 흐름에서는 조정이 와도 RSI가 50 근처에서 멈추고 다시 올라가는 경우가 많습니다.`,
      `그래서 50선을 지키느냐 내주느냐가 흐름이 살아 있는지 보는 간단한 기준이 됩니다.`,
    ];
    if (v > 30) return [
      `지금 RSI는 ${v.toFixed(1)}입니다. 30과 50 사이, 내리는 쪽에 힘이 조금 더 실려 있는 구간입니다.`,
      `반등이 나오더라도 RSI가 50을 넘지 못하고 되밀리면, 아직 하락 흐름이 이어지고 있다고 봅니다.`,
      `반대로 50을 확실히 넘어서면 흐름이 바뀌기 시작했다는 첫 단서가 됩니다.`,
    ];
    return [
      `지금 RSI는 ${v.toFixed(1)}입니다. 흔히 "과매도"라고 부르는 30 아래 구간입니다.`,
      `여기서도 오해를 조심해야 합니다. 과매도는 반등을 보장하지 않습니다.`,
      `크게 무너지는 국면에서는 RSI가 20~30에 오래 눌려 있는 채로 가격이 계속 빠지기도 합니다.`,
      `"싸 보인다"가 아니라 "많이, 빠르게 내렸다"는 사실의 확인으로 읽는 편이 안전합니다.`,
    ];
  }

  function buildRSIGuide() {
    const P = rsiPeriod;
    const v = rsiLast;
    const L = [];

    L.push("■ RSI가 무엇인가요");
    L.push(`최근 ${P}개 봉 동안 오른 폭과 내린 폭을 견주어 0에서 100 사이 숫자 하나로 바꾼 지표입니다. `
      + `오른 쪽 힘이 셀수록 100에 가까워지고 내린 쪽 힘이 셀수록 0에 가까워집니다. `
      + `가격이 "얼마인가"가 아니라 "어느 쪽으로 얼마나 힘차게 움직였는가"를 보는 속도계라고 생각하시면 됩니다. `
      + `지금은 ${current.label} 화면이므로 봉 하나가 ${current.label} 한 칸이고, 최근 ${P}칸을 재고 있습니다.`);

    L.push("\n■ 지금 상태");
    if (v == null) {
      L.push("아직 계산할 봉이 충분하지 않습니다. 차트가 더 불러와지면 값이 표시됩니다.");
    } else {
      L.push(rsiZoneGuide(v).join(" "));
      L.push(`정리하면, RSI 하나만으로 사고파는 판단을 하기보다 "지금 힘이 어느 쪽에 있고, 그 힘이 세지는 중인지 약해지는 중인지"를 보는 용도로 쓰는 것이 맞습니다.`);
    }

    L.push("\n■ 숫자(기간)를 바꾸면 무엇이 달라지나요");
    L.push(`레전드의 − / + 로 기간을 바꿀 수 있고 지금은 ${P}입니다. `
      + `숫자를 줄이면(예: 7) 최근 며칠만 재기 때문에 반응이 빨라지지만 그만큼 자주 흔들리고 헛신호가 늘어납니다. `
      + `숫자를 키우면(예: 21) 느리지만 차분해집니다. `
      + `가장 널리 쓰이는 값이 14이고, 남들이 많이 보는 값이라 신호가 실제로 작동하는 면도 있습니다. `
      + `처음에는 14로 두고 보시길 권합니다.`);

    L.push("\n■ RSI 추세선");
    if (lastRSI && lastRSI.notes && lastRSI.notes.length) {
      L.push(`가격에 추세선을 긋듯 RSI에도 그을 수 있습니다. 지금 잡힌 선: ${lastRSI.notes.join(", ")}. `
        + `괄호 안 숫자는 현재 RSI가 그 선보다 얼마나 위(+) 또는 아래(−)에 있는지이고, ×숫자는 그 선에 몇 번 닿았는지입니다. `
        + `닿은 횟수가 많을수록 시장이 그 선을 의식하고 있다는 뜻이라 더 믿을 만합니다. `
        + `가격은 아직 안 움직였는데 RSI가 이 선을 먼저 뚫는 경우가 있는데, 그때가 흐름이 바뀌는 이른 단서가 되기도 합니다.`);
    } else {
      L.push(`지금은 조건을 만족하는 RSI 추세선이 없습니다. 이 앱은 억지로 선을 긋지 않습니다. `
        + `스윙(고점과 저점)이 뚜렷해지면 자동으로 점선이 나타납니다. 선이 없다는 것은 "지금은 방향이 뚜렷하지 않다"는 정보이기도 합니다.`);
    }

    L.push("\n■ 다이버전스");
    L.push(`가격과 RSI가 서로 다른 말을 하는 상태입니다. 예를 들어 가격은 전 고점보다 더 높이 올라갔는데 `
      + `RSI는 오히려 낮아졌다면, 가격은 올랐지만 그 힘은 전보다 약해졌다는 뜻입니다. 이것이 하락(약세) 다이버전스입니다. `
      + `반대로 가격은 전 저점보다 더 내려갔는데 RSI는 높아졌다면 상승(강세) 다이버전스입니다.`);
    if (lastRSI && lastRSI.div) {
      const d = lastRSI.div;
      const rUp = d.rB >= d.rA, pUp = d.B.price >= d.A.price;
      L.push(`지금 화면에는 ${d.label}가 잡혀 있습니다. ${d.desc}. `
        + `구체적으로 RSI는 ${d.rA.toFixed(1)}에서 ${d.rB.toFixed(1)}까지 ${rUp ? "높아졌고" : "낮아졌고"}, `
        + `같은 기간 가격은 ${fmtPrice(d.A.price)}에서 ${fmtPrice(d.B.price)}까지 ${pUp ? "올랐습니다" : "내렸습니다"}. `
        + `차트 위아래 두 창에 같은 두 지점을 잇는 선으로 표시해 두었습니다.`);
    } else {
      L.push(`지금 화면에서는 조건을 만족하는 다이버전스가 없습니다. 나타나면 위아래 두 창에 연결선과 함께 배지가 뜹니다.`);
    }
    L.push(`다만 초보자가 가장 크게 데는 지점이 바로 여기입니다. 다이버전스는 신호가 이르게 나오는 편이라, `
      + `뜬 뒤에도 가격이 한참 더 같은 방향으로 가는 일이 잦습니다. 여러 번 어긋나다가 마지막에 한 번 맞기도 합니다. `
      + `그래서 이것만 보고 반대 방향에 크게 걸면 위험합니다. 지지·저항선이 함께 깨지거나 지켜지는지를 반드시 같이 확인하세요.`);

    L.push("\n■ 처음이라면 이렇게");
    L.push(`1) RSI는 방향을 맞히는 도구가 아니라 힘의 세기를 재는 도구입니다. 가격 차트가 먼저이고 RSI는 보조입니다.\n`
      + `2) 70과 30보다 50선을 먼저 익히세요. 흐름이 살아 있는지 보는 데 더 쓸모가 많습니다.\n`
      + `3) 짧은 시간봉일수록 신호가 자주 뜨고 자주 틀립니다. 일봉이나 4시간봉부터 눈에 익히시길 권합니다.\n`
      + `4) 같은 자리에서 지지·저항선, 이평선과 겹쳐 나오는 신호일수록 무게가 있습니다.`);

    L.push("\n※ 자동 계산된 참고 자료이며 매수·매도 권유가 아닙니다. 투자 판단과 그 결과의 책임은 본인에게 있습니다.");
    return L.join("\n");
  }

  // ── RSI 상황 AI 분석 ──
  // 값 하나가 아니라 최근 추이·추세선·다이버전스·주변 지지저항을 함께 넘긴다.
  // Claude API에 닿지 않는 환경(GitHub Pages 등)에서는 규칙 기반 설명으로 대체한다.
  function buildRSIContext() {
    if (rsiLast == null || !lastRSI) return null;
    const bars = barsArr.slice(-40);
    return {
      종목: `${coin.name}(${coin.key}/USDT)`,
      시간봉: current.label,

      } : null,

  }

  function rsiInfoHTML(val, tl, div) {
    if (val == null) return perHTML() + `<span>데이터 부족</span>`;
    const zone = val >= 70 ? ["hot", "과매수"] : val <= 30 ? ["cold", "과매도"]
               : val >= 50 ? ["", "중립(강)"] : ["", "중립(약)"];
    let h = perHTML() +
            `<span class="val">${val.toFixed(1)}</span>` +
            `<span class="zone ${zone[0]}">${zone[1]}</span>`;
    if (tl) h += `<span class="tl">${tl}</span>`;
    if (div) h += `<span class="div ${div.cls}${div.regular ? "" : " hidden"}" ` +
                  `title="${div.desc}">${div.label}</span>`;
    return h;
  }

  // RSI 전체 계산 → 렌더 (시간봉 로드·봉 마감·토글 시)
  function runRSI(bars) {
    if (!showRSI) return;
    ensureRSIChart();
    clearRSIOverlays();
    if (!bars || bars.length < rsiPeriod + 5) {
      try { setRSIData([], []); } catch {}
      rsiLast = null;
      $("rsi-info").innerHTML = rsiInfoHTML(null);
      return;
    }
    const pts = calcRSI(bars, rsiPeriod);
    // 앞쪽 봉은 whitespace로 채워 위 차트와 봉 번호를 일치시킨다
    const data = bars.map((b, i) => i < rsiPeriod
      ? { time: b.time }
      : { time: b.time, value: pts[i - rsiPeriod].value });
    setRSIData(data, bars);
    rsiLast = pts[pts.length - 1].value;
    syncScaleWidth();
    try {
      const r = chart.timeScale().getVisibleLogicalRange();
      if (r) { rsiSyncing = true; rsiChart.timeScale().setVisibleLogicalRange(r); rsiSyncing = false; }
    } catch { rsiSyncing = false; }

    // ① RSI 추세선 — 최근 구간만 본다 (오래된 스윙까지 이으면 의미가 흐려진다)
    const win = pts.slice(-140);
    const pw = Math.max(2, Math.round(current.width * 0.75));
    const { highs: rh, lows: rl } = rsiPivots(win, pw);
    const tlNotes = [];
    [
      { tl: rsiTrendline(rh, win, "res", 2.2), color: "#f59e0b", kind: "저항" },
      { tl: rsiTrendline(rl, win, "sup", 2.2), color: "#22c55e", kind: "지지" },
    ].forEach(({ tl, color, kind }) => {
      if (!tl) return;
      const t1 = bars[tl.P.i], t2 = bars[tl.endI];
      if (!t1 || !t2 || t2.time <= t1.time) return;
      const s = rsiChart.addLineSeries({
        color, lineWidth: tl.touches >= 3 ? 2 : 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
      });
      s.setData([
        { time: t1.time, value: tl.P.value },
        { time: t2.time, value: tl.endVal },
      ]);
      rsiTrendSeries.push(s);
      // 연장선이 0~100 밖으로 나가면 더 이상 읽을 의미가 없으므로 수치는 생략
      if (tl.nowVal >= 0 && tl.nowVal <= 100) {
        const gap = rsiLast - tl.nowVal;
        tlNotes.push(`${kind}선 ${tl.nowVal.toFixed(0)}` +
          `(${gap >= 0 ? "+" : ""}${gap.toFixed(1)})×${tl.touches}`);
      }
    });

    // ② 다이버전스 — 가격 창과 RSI 창에 같은 두 지점을 이어 그린다
    const div = findDivergence(bars, pts, current.width);
    if (div) {
      const color = div.cls === "bear" ? DIV_BEAR : DIV_BULL;
      const style = div.regular ? LightweightCharts.LineStyle.Solid
                                : LightweightCharts.LineStyle.Dotted;
      const mk = (c, pts2) => {
        const s = c.addLineSeries({
          color, lineWidth: 2, lineStyle: style,
          priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
        });
        s.setData(pts2);
        return s;
      };
      priceDivSeries.push(mk(chart, [
        { time: div.A.time, value: div.A.price },
        { time: div.B.time, value: div.B.price },
      ]));
      rsiDivSeries.push(mk(rsiChart, [
        { time: div.A.time, value: div.rA },
        { time: div.B.time, value: div.rB },
      ]));

      // 두 지점을 이은 기울기를 현재 봉까지 점선으로 연장한다.
      // 형성 구간(실선)과 연장부(점선)를 나눠 그려야 "실제로 관측된 두 지점"과
      // "그 기울기를 이어 본 것"이 눈으로 구분된다. 뒤엣것은 근거가 약하다.
      const span = div.B.i - div.A.i;
      if (span > 0) {
        const lastI = bars.length - 1;
        // 값이 유효 범위를 벗어나면 벗어나기 직전 봉에서 끊는다
        const project = (v0, slope, lo, hi) => {
          let endI = lastI;
          for (let i = div.B.i + 1; i <= lastI; i++) {
            const v = v0 + slope * (i - div.B.i);
            if (v < lo || v > hi) { endI = i - 1; break; }
          }
          return { i: endI, v: v0 + slope * (endI - div.B.i) };
        };
        const mkExt = (c, v0, slope, lo, hi) => {
          const e = project(v0, slope, lo, hi);
          if (e.i <= div.B.i) return null;
          const s = c.addLineSeries({
            color, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dotted,
            priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
            autoscaleInfoProvider: () => null,   // 연장선이 눈금을 늘리지 않도록
          });
          s.setData([
            { time: bars[div.B.i].time, value: v0 },
            { time: bars[e.i].time, value: e.v },
          ]);
          return s;
        };
        const pExt = mkExt(chart, div.B.price, (div.B.price - div.A.price) / span, 0, Infinity);
        if (pExt) priceDivSeries.push(pExt);
        const rExt = mkExt(rsiChart, div.rB, (div.rB - div.rA) / span, 0, 100);
        if (rExt) rsiDivSeries.push(rExt);
      }
    }

    // 최근 흐름까지 남겨 둔다 (AI 분석에 값 하나가 아니라 추이를 넘기기 위해)
    lastRSI = {
      value: rsiLast, div, notes: tlNotes,
      series: pts.slice(-40).map(p => +p.value.toFixed(1)),
    };
    $("rsi-info").innerHTML = rsiInfoHTML(rsiLast, tlNotes.join("  "), div);
  }

  // 선·음영·구간 강조를 한 번에 세팅한다
  function setRSIData(data, bars) {
    rsiSeries.setData(data);
    // 음영은 전체 구간에 걸친 상수선(100 / 0)으로 만든다
    rsiBandHi.setData(bars.map(b => ({ time: b.time, value: 100 })));
    rsiBandLo.setData(bars.map(b => ({ time: b.time, value: 0 })));
  }

  // 진행 중인 봉: 마지막 점만 갱신 (전체 재계산·재렌더는 봉 마감 때만)
  let rsiTickRaf = 0;
  function updateRSILive() {
    if (!showRSI || !rsiSeries || !barsArr.length || rsiTickRaf) return;
    rsiTickRaf = requestAnimationFrame(() => {
      rsiTickRaf = 0;
      const bars = barsArr;
      if (bars.length < rsiPeriod + 5) return;
      const pts = calcRSI(bars, rsiPeriod);
      const last = pts[pts.length - 1];
      if (!last || last.time !== bars[bars.length - 1].time) return;
      try { rsiSeries.update({ time: last.time, value: last.value }); } catch {}
      rsiLast = last.value;
      const notes = lastRSI ? lastRSI.notes : [];
      const div = lastRSI ? lastRSI.div : null;
      $("rsi-info").innerHTML = rsiInfoHTML(rsiLast, notes.join("  "), div);
    });
  }

  // 시간봉별 저장소: 사용자가 지우기 전까지 선을 보존
  // (일반 브라우저에서는 새로고침 후에도 유지, 저장 불가 환경에서는 세션 동안만 유지)
