<style>
  :root {
    --bg: #0c0e14;
    --panel: #131722;
    --border: #232838;
    --text: #e7ebf3;
    --muted: #8b93a7;
    --up: #ef4444;     /* 상승 = 빨강 (한국 관례) */
    --down: #3b82f6;   /* 하락 = 파랑 */
    --btc: #f7931a;
    --mono: "SF Mono", "Cascadia Mono", Consolas, "Roboto Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 헤더 ── */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .symbol { display: flex; align-items: center; gap: 8px; }
  .btc-mark {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--btc);
    color: #0c0e14;
    font-weight: 800;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .symbol .name { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
  .symbol .pair { font-size: 11px; color: var(--muted); }

  .price-block { display: flex; align-items: baseline; gap: 10px; }
  #price {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    transition: color .15s;
  }
  #price.tick-up { color: var(--up); }
  #price.tick-down { color: var(--down); }
  #chg24 {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
  }
  #chg24.up { color: var(--up); background: rgba(239,68,68,.12); }
  #chg24.down { color: var(--down); background: rgba(59,130,246,.12); }

  .stats { display: flex; gap: 14px; margin-left: auto; }
  .stat { text-align: right; }
  .stat .k { font-size: 10px; color: var(--muted); }
  .stat .v { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* ── 시간봉 탭 / 도구 모음 ── */
  nav, #tools {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: thin;
  }
  #tools { padding: 7px 16px; background: rgba(19,23,34,.5); }
  #tools .grp-label {
    font-size: 10px; color: var(--muted); font-weight: 700;
    letter-spacing: .5px; margin-right: 2px; white-space: nowrap;
  }
  nav button, #tools button {
    background: none;
    border: 1px solid transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    flex-shrink: 0;
  }
  nav button:hover, #tools button:hover { color: var(--text); background: var(--panel); }
  nav button.active {
    color: var(--btc);
    background: rgba(247,147,26,.1);
    border-color: rgba(247,147,26,.35);
  }
  nav button:focus-visible, #tools button:focus-visible { outline: 2px solid var(--btc); outline-offset: 1px; }

  .sep { width: 1px; height: 18px; background: var(--border); margin: 0 8px; flex-shrink: 0; }
  .toggle { font-size: 12px; }
  .toggle.on-sr { color: #22c55e; background: rgba(34,197,94,.08); border-color: rgba(34,197,94,.3); }
  .toggle.on-tr { color: #f59e0b; background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.3); }
  .toggle.on-draw { color: #c084fc; background: rgba(192,132,252,.15); border-color: rgba(192,132,252,.5); }
  .toggle.on-ai { color: var(--btc); border-color: rgba(247,147,26,.35); background: rgba(247,147,26,.08); }

  /* 도구 묶음: 자동 분석 / 직접 그리기를 시각적으로 분리 */
  .tool-group {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 8px 3px 6px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .tool-group.auto {
    border: 1px solid rgba(139,147,167,.22);
    background: rgba(139,147,167,.05);
  }
  .tool-group.draw {
    border: 1px solid rgba(192,132,252,.3);
    background: rgba(192,132,252,.06);
  }
  .tool-group.draw .grp-label { color: #c084fc; }

  #sr-info { display: flex; gap: 14px; flex-wrap: wrap; }
  #sr-info .sup { color: #22c55e; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #sr-info .res { color: #f59e0b; font-family: var(--mono); font-variant-numeric: tabular-nums; }

  #draw-hint {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #c084fc; z-index: 5; pointer-events: none;
    background: rgba(19,23,34,.85); padding: 4px 12px; border-radius: 6px;
    white-space: nowrap;
  }
  #draw-hint:empty { display: none; }

  .conn {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--muted);
    flex-shrink: 0;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #555c6e; }
  .dot.live { background: #22c55e; animation: pulse 1.6s ease-in-out infinite; }
  .dot.err { background: var(--up); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,.5); }
    50% { box-shadow: 0 0 0 5px rgba(34,197,94,0); }
  }
  @media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }

  /* ── 차트 ── */
  #chart-wrap { flex: 1; position: relative; min-height: 0; }
  #chart { position: absolute; inset: 0; }
  #handles {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
    width: 100%; height: 100%;
  }
  #handles .handle {
    pointer-events: auto;
    cursor: grab;
    fill: #131722;
    stroke: #c084fc;
    stroke-width: 2.5;
  }
  #handles .handle:hover { fill: #c084fc; }
  #handles .handle:active { cursor: grabbing; }
  /* 선 본체를 잡거나 더블클릭할 수 있는 투명한 띠 */
  #handles .hitline {
    pointer-events: stroke;
    cursor: move;
    stroke: transparent;
    stroke-width: 16;
    fill: none;
  }

  #banner {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(239,68,68,.14);
    border: 1px solid rgba(239,68,68,.4);
    color: #fca5a5;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 6px;
    display: none;
    z-index: 5;
    max-width: 90%;
  }
  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px;
    background: var(--bg);
    z-index: 4;
  }

  /* ── AI 해설 패널 ── */
  #ai-panel {
    display: none;
    border-top: 1px solid var(--border);
    background: var(--panel);
    max-height: 32vh;
    overflow-y: auto;
    flex-shrink: 0;
  }
  #ai-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 16px 0;
  }
  #ai-src { font-size: 11px; color: var(--btc); font-weight: 700; }
  #ai-close {
    background: none; border: none; color: var(--muted);
    font-size: 14px; cursor: pointer; padding: 2px 6px;
  }
  #ai-close:hover { color: var(--text); }
  #ai-body {
    padding: 8px 16px 12px;
    font-size: 13px; line-height: 1.7; color: var(--text);
    white-space: pre-wrap;
  }

  footer {
    padding: 6px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  #last-update { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  @media (max-width: 560px) {
    .stats { display: none; }
    #price { font-size: 21px; }
    nav button, #tools button { padding: 5px 9px; font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="symbol">
    <div class="btc-mark">₿</div>
    <div>
      <div class="name">비트코인</div>
      <div class="pair">BTC/USDT · Binance</div>
    </div>
  </div>
  <div class="price-block">
    <span id="price">—</span>
    <span id="chg24"></span>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">24h 고가</div><div class="v" id="high24">—</div></div>
    <div class="stat"><div class="k">24h 저가</div><div class="v" id="low24">—</div></div>

  <div id="ai-head">

  </div>

  <span id="sr-info">자동 분석 대기 중…</span>

<script>
(() => {
  // 접속 실패 시 순서대로 예비 서버 자동 전환
  const REST_HOSTS = [
    "https://data-api.binance.vision/api/v3",
    "https://api.binance.com/api/v3",
    "https://api1.binance.com/api/v3",
    "https://api2.binance.com/api/v3",
  ];
  let restIdx = 0;
  const WS_HOSTS = [
    "wss://data-stream.binance.vision/stream?streams=",
    "wss://stream.binance.com:9443/stream?streams=",
  ];
  let wsIdx = 0;

  // 시간봉 정의 (연봉은 월봉을 클라이언트에서 집계)
  // width: 스윙 판정에 필요한 좌우 봉 수, tol: 레벨 클러스터 허용폭 (시간봉 변동성에 맞춤)
  const TIMEFRAMES = [
    { key: "1h", label: "1시간", interval: "1h", limit: 500, intraday: true,  width: 5, tol: 0.004 },
    { key: "4h", label: "4시간", interval: "4h", limit: 500, intraday: true,  width: 5, tol: 0.006 },
    { key: "1d", label: "일봉",  interval: "1d", limit: 730, intraday: false, width: 4, tol: 0.010 },
    { key: "1w", label: "주봉",  interval: "1w", limit: 520, intraday: false, width: 3, tol: 0.014 },
    { key: "1M", label: "월봉",  interval: "1M", limit: 200, intraday: false, width: 2, tol: 0.018 },
    { key: "1y", label: "연봉",  interval: "1M", limit: 1000, intraday: false, width: 1, tol: 0.025, aggregateYear: true },
  ];

  const $ = id => document.getElementById(id);
  const fmtPrice = v => v >= 1000
    ? v.toLocaleString("en-US", { maximumFractionDigits: 1 })
    : v.toLocaleString("en-US", { maximumFractionDigits: 2 });
  const fmtVol = v => v.toLocaleString("en-US", { maximumFractionDigits: 0 });

  // ── 차트 초기화 ──
  const chart = LightweightCharts.createChart($("chart"), {
    layout: {
      background: { type: "solid", color: "#0c0e14" },
      textColor: "#8b93a7",
      fontFamily: "'SF Mono', Consolas, monospace",
      fontSize: 11,
    },
    grid: {
      vertLines: { color: "rgba(35,40,56,.55)" },
      horzLines: { color: "rgba(35,40,56,.55)" },
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: "#8b93a7", width: 1, style: 2, labelBackgroundColor: "#232838" },
      horzLine: { color: "#8b93a7", width: 1, style: 2, labelBackgroundColor: "#232838" },
    },
    rightPriceScale: { borderColor: "#232838", scaleMargins: { top: 0.08, bottom: 0.22 } },
    timeScale: { borderColor: "#232838", rightOffset: 4 },
    watermark: {
      visible: true, text: "BTC/USDT", color: "rgba(139,147,167,.08)",
      fontSize: 44, horzAlign: "center", vertAlign: "center",
    },
    localization: { priceFormatter: fmtPrice },
  });

  const candles = chart.addCandlestickSeries({
    upColor: "#ef4444", downColor: "#3b82f6",
    borderUpColor: "#ef4444", borderDownColor: "#3b82f6",
    wickUpColor: "#ef4444", wickDownColor: "#3b82f6",
  });
  const volume = chart.addHistogramSeries({
    priceFormat: { type: "volume" },
    priceScaleId: "vol",
  });
  chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.84, bottom: 0 } });

  let lastW = 0, lastH = 0, resizeRaf = 0;
  new ResizeObserver(() => {
    const el = $("chart-wrap");
    const w = el.clientWidth, h = el.clientHeight;
    if (w === lastW && h === lastH) return;   // 실제 크기 변화가 없으면 무시
    lastW = w; lastH = h;
    if (resizeRaf) return;
    resizeRaf = requestAnimationFrame(() => {
      resizeRaf = 0;
      chart.applyOptions({ width: w, height: h });
      scheduleHandles();
    });
  }).observe($("chart-wrap"));

  // ── 상태 ──
  let current = TIMEFRAMES[2];   // 기본: 일봉
  let ws = null;
  let wsRetry = 0;
  let lastPrice = null;
  let barMap = new Map();        // time(sec) -> candle (연봉 집계용은 year -> candle)
  let loadSeq = 0;
  let showSR = true, showTrend = true;
  let lastAnalysis = null;
  let priceLines = [];
  let trendSeries = [];

  // ── 자동 분석 엔진: 스윙 포인트 → 지지/저항 클러스터 + 추세선 ──
  function detectPivots(bars, width) {
    const highs = [], lows = [];
    for (let i = width; i < bars.length - width; i++) {
      let isH = true, isL = true;
      for (let j = i - width; j <= i + width; j++) {
        if (j === i) continue;
        if (bars[j].high >= bars[i].high) isH = false;
        if (bars[j].low <= bars[i].low) isL = false;
        if (!isH && !isL) break;
      }
      if (isH) highs.push({ i, time: bars[i].time, price: bars[i].high });
      if (isL) lows.push({ i, time: bars[i].time, price: bars[i].low });
    }
    return { highs, lows };
  }

  // 근접한 스윙 레벨을 묶어 터치 횟수가 많은 가격대를 지지/저항으로 판정
  function clusterLevels(pivots, tolPct) {
    const pts = [...pivots].sort((a, b) => a.price - b.price);
    const clusters = [];
    for (const p of pts) {
      const c = clusters[clusters.length - 1];
      if (c && (p.price - c.avg) / c.avg <= tolPct) {
        c.points.push(p);
        c.avg = c.points.reduce((s, q) => s + q.price, 0) / c.points.length;
      } else {
        clusters.push({ points: [p], avg: p.price });
      }
    }
    return clusters.map(c => ({ price: c.avg, touches: c.points.length }));
  }

  // 스윙 포인트 쌍을 이어 보고, "캔들을 관통하지 않으면서" 접촉이 많은 조합을 최적 추세선으로 선택
  // bars: 검증에 사용할 전체 캔들 (선이 마지막 봉까지 연장되므로 시작점~끝까지 전 구간을 검사)
  function bestTrendline(pivots, bars, type, tolPct) {
    if (pivots.length < 2) return null;
    let best = null;
    const lastIdx = bars.length - 1;
    for (let a = 0; a < pivots.length - 1; a++) {
      for (let b = a + 1; b < pivots.length; b++) {
        const p1 = pivots[a], p2 = pivots[b];
        if (p2.i - p1.i < 3) continue;               // 너무 붙은 두 점은 기울기가 불안정
        const slope = (p2.price - p1.price) / (p2.i - p1.i);

        // 검증 1: 시작점부터 차트 끝까지 캔들 관통 금지
        // (지지선 아래로 저가가 뚫거나, 저항선 위로 고가가 뚫으면 탈락. 미세한 꼬리 이탈 1회만 허용)
        let pierce = 0, ok = true;
        for (let i = p1.i; i <= lastIdx; i++) {
          const lv = p1.price + slope * (i - p1.i);
          if (lv <= 0) { ok = false; break; }
          const over = type === "sup"
            ? (lv - bars[i].low) / lv               // 지지선 아래로 뚫린 깊이
            : (bars[i].high - lv) / lv;             // 저항선 위로 뚫린 깊이
          if (over > tolPct * 2) { ok = false; break; }   // 명백한 관통 → 즉시 탈락
          if (over > tolPct * 0.6) pierce++;              // 꼬리가 살짝 넘는 정도
        }
        if (!ok || pierce > 1) continue;

        // 검증 2: 스윙 포인트 접촉 수 (선 근처 tol 이내)
        let touches = 0;
        for (const q of pivots) {
          const lv = p1.price + slope * (q.i - p1.i);
          if (Math.abs((q.price - lv) / lv) <= tolPct) touches++;
        }
        if (touches < 2) continue;

        // 점수: 접촉 3회 이상 강하게 우대 + 두 점 사이가 넓을수록(기울기 안정) 가산
        const score = touches * 10 + (touches >= 3 ? 25 : 0) + (p2.i - p1.i) * 0.1;
        if (!best || score > best.score) best = { p1, p2, slope, touches, score };
      }
    }
    return best;
  }

  function clearAnalysis() {
    priceLines.forEach(l => { try { candles.removePriceLine(l); } catch {} });
    priceLines = [];
    trendSeries.forEach(s => { try { chart.removeSeries(s); } catch {} });
    trendSeries = [];
  }

  function updateSRFooter(sup, res, price) {
    const el = $("sr-info");
    if (!sup && !res) { el.textContent = "탐지된 지지/저항 없음 (데이터 부족)"; return; }
    const parts = [];
    if (sup) {
      const d = ((sup.price - price) / price * 100).toFixed(1);
      parts.push(`<span class="sup">▼ 지지 ${fmtPrice(sup.price)} (${d}%) ×${sup.touches}</span>`);
    }
    if (res) {
      const d = ((res.price - price) / price * 100).toFixed(1);
      parts.push(`<span class="res">▲ 저항 ${fmtPrice(res.price)} (+${d}%) ×${res.touches}</span>`);
    }
    el.innerHTML = parts.join("");
  }

  function runAnalysis() {
    clearAnalysis();
    const bars = [...barMap.values()].sort((a, b) => a.time - b.time);
    barsArr = bars;   // 자석 스냅 계산에 사용
    const price = lastPrice ?? (bars.length ? bars[bars.length - 1].close : 0);
    if (bars.length < 15 || !price) { updateSRFooter(null, null, price); return; }

    const width = current.width;
    const tol = current.tol;
    // 차트에 보이는 전체 구간을 분석 (기존 300봉 제한 → 화면 밖 상단 구조가 누락되던 문제 해결)
    const lookback = bars.slice(-800);
    const { highs, lows } = detectPivots(lookback, width);

    let nearestSup = null, nearestRes = null;

    // ① 지지/저항 수평선 — 현재가 아래(지지)와 위(저항)를 각각 따로 선정해 균형 유지
    // 다중 접촉(×2↑) 레벨을 우선하되, 급등·급락 구간처럼 한 번만 찍힌 주요 스윙밖에
    // 없는 쪽은 단일 스윙 레벨로 보충한다 (저항이 통째로 사라지는 문제 방지)
    if (showSR) {
      const clusters = clusterLevels([...highs, ...lows], tol);
      const pickLevels = isSup => {
        const side = clusters.filter(l => isSup ? l.price <= price : l.price > price);
        const multi = side.filter(l => l.touches >= 2)
          .sort((a, b) => b.touches - a.touches || (isSup ? b.price - a.price : a.price - b.price))
          .slice(0, 4);
        if (multi.length >= 3) return multi;
        const used = new Set(multi.map(l => l.price));
        const singles = side.filter(l => l.touches === 1 && !used.has(l.price))
          .sort((a, b) => isSup ? b.price - a.price : a.price - b.price)  // 현재가에 가까운 순
          .slice(0, 3 - multi.length);
        return [...multi, ...singles];
      };
      for (const lv of [...pickLevels(true), ...pickLevels(false)]) {
        const isSup = lv.price <= price;
        // 중요도(터치 횟수) 4단계: 5회↑ 3px, 3~4회 2px, 2회 1px 점선, 1회(스윙 보충) 얇은 점선·흐림
        const w = lv.touches >= 5 ? 3 : lv.touches >= 3 ? 2 : 1;
        const alpha = lv.touches >= 5 ? 0.95 : lv.touches >= 3 ? 0.75 : lv.touches >= 2 ? 0.4 : 0.3;
        priceLines.push(candles.createPriceLine({
          price: lv.price,
          color: isSup ? `rgba(34,197,94,${alpha})` : `rgba(245,158,11,${alpha})`,
          lineWidth: w,
          lineStyle: w > 1 ? LightweightCharts.LineStyle.Solid : LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: w > 1,
          title: `${isSup ? "지지" : "저항"} ×${lv.touches}`,
        }));
        if (isSup && (!nearestSup || lv.price > nearestSup.price)) nearestSup = lv;
        if (!isSup && (!nearestRes || lv.price < nearestRes.price)) nearestRes = lv;
      }
    }
    updateSRFooter(nearestSup, nearestRes, price);

    // ② 추세선 (스윙 저점 연결 = 상승 지지 추세선, 스윙 고점 연결 = 하락 저항 추세선)
    const trendInfo = [];
    if (showTrend && !current.aggregateYear) {
      const win = lookback.slice(-160);
      const { highs: wh, lows: wl } = detectPivots(win, width);
      const lines = [
        { tl: bestTrendline(wl, win, "sup", tol), color: "#22c55e", kind: "지지 추세선" },
        { tl: bestTrendline(wh, win, "res", tol), color: "#f59e0b", kind: "저항 추세선" },
      ];
      for (const { tl, color, kind } of lines) {
        if (!tl) continue;
        const lastIdx = win.length - 1;
        const endPrice = tl.p1.price + tl.slope * (lastIdx - tl.p1.i);
        if (endPrice <= 0) continue;
        const s = chart.addLineSeries({
          color,
          lineWidth: tl.touches >= 4 ? 3 : tl.touches >= 3 ? 2 : 1,  // 터치 횟수에 따른 굵기
          lineStyle: LightweightCharts.LineStyle.Dashed,
          priceLineVisible: false, lastValueVisible: false,
          crosshairMarkerVisible: false,
        });
        s.setData([
          { time: tl.p1.time, value: tl.p1.price },
          { time: win[lastIdx].time, value: endPrice },
        ]);
        trendSeries.push(s);
        trendInfo.push({ kind, slope: tl.slope, touches: tl.touches, endPrice });
      }
    }

    // AI 해설용 최근 분석 결과 저장
    lastAnalysis = { price, sup: nearestSup, res: nearestRes, trends: trendInfo,
      bars: bars.slice(-30) };
  }

  // ── 탭 렌더링 ──
  const nav = $("tabs");
  TIMEFRAMES.forEach(tf => {
    const b = document.createElement("button");
    b.textContent = tf.label;
    b.dataset.key = tf.key;
    if (tf.key === current.key) b.classList.add("active");
    b.addEventListener("click", () => switchTimeframe(tf));
    nav.appendChild(b);
  });

  const tools = $("tools");
  const grpAuto = document.createElement("div");
  grpAuto.className = "tool-group auto";
  tools.appendChild(grpAuto);
  const lblAuto = document.createElement("span");
  lblAuto.className = "grp-label";
  lblAuto.textContent = "자동 분석";
  grpAuto.appendChild(lblAuto);

  const btnSR = document.createElement("button");
  btnSR.className = "toggle on-sr";
  btnSR.textContent = "지지·저항";
  btnSR.setAttribute("aria-pressed", "true");
  btnSR.addEventListener("click", () => {
    showSR = !showSR;
    btnSR.classList.toggle("on-sr", showSR);
    btnSR.setAttribute("aria-pressed", String(showSR));
    runAnalysis();
  });
  grpAuto.appendChild(btnSR);

  const btnTR = document.createElement("button");
  btnTR.className = "toggle on-tr";
  btnTR.textContent = "추세선";
  btnTR.setAttribute("aria-pressed", "true");
  btnTR.addEventListener("click", () => {
    showTrend = !showTrend;
    btnTR.classList.toggle("on-tr", showTrend);
    btnTR.setAttribute("aria-pressed", String(showTrend));
    runAnalysis();
  });
  grpAuto.appendChild(btnTR);

  // ── 사용자 그리기 도구 (자석 스냅 · 이동/회전 · 자동 저장) ──
  let drawMode = null;             // null | 'trend' | 'horiz'
  let pending = null;              // 추세선 첫 클릭 지점
  let userLines = [];              // {price, line} 사용자 수평선
  let userTrends = [];             // {p1,p2,series} 사용자 추세선
  let barsArr = [];                // 현재 시간봉의 정렬된 캔들
  let magnet = true;
  let extendMode = false;
  let dragging = null;             // {type:'end'|'mid'|'horiz', ...}
  let previewSeries = null;
  const SNAP_PX = 14;
  const SVGNS = "http://www.w3.org/2000/svg";

  // 시간봉별 저장소: 사용자가 지우기 전까지 선을 보존
  // (일반 브라우저에서는 새로고침 후에도 유지, 저장 불가 환경에서는 세션 동안만 유지)
  const STORE_KEY = "btc_chart_user_lines_v1";
  let lineStore = {};
  try { lineStore = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch {}
  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(lineStore)); } catch {}
  }
  function saveStore() {
    lineStore[current.key] = {
      horiz: userLines.map(h => h.price),
      trends: userTrends.map(t => ({
        p1: { time: t.p1.time, price: t.p1.price },
        p2: { time: t.p2.time, price: t.p2.price },
      })),
    };
    persist();
  }

  const sep2 = document.createElement("div");
  sep2.className = "sep";
  tools.appendChild(sep2);
  const grpDraw = document.createElement("div");
  grpDraw.className = "tool-group draw";
  tools.appendChild(grpDraw);
  const lblDraw = document.createElement("span");
  lblDraw.className = "grp-label";
  lblDraw.textContent = "직접 그리기";
  grpDraw.appendChild(lblDraw);

  function applyDrawMode() {
    btnDrawT.classList.toggle("on-draw", drawMode === "trend");
    btnDrawH.classList.toggle("on-draw", drawMode === "horiz");
    $("chart").style.cursor = drawMode ? "crosshair" : "";
    setDrawHint();
  }
  function makeDrawBtn(label, mode) {
    const b = document.createElement("button");
    b.className = "toggle";
    b.textContent = label;
    b.addEventListener("click", () => {
      drawMode = drawMode === mode ? null : mode;
      pending = null;
      clearPreview();
      applyDrawMode();
    });
    return b;
  }
  const btnDrawT = makeDrawBtn("✏ 추세선", "trend");
  const btnDrawH = makeDrawBtn("─ 수평선", "horiz");

  const btnMagnet = document.createElement("button");
  btnMagnet.className = "toggle on-draw";
  btnMagnet.textContent = "🧲 자석";
  btnMagnet.title = "캔들 고가·저가(꼬리)에 자동으로 붙습니다";
  btnMagnet.setAttribute("aria-pressed", "true");
  btnMagnet.addEventListener("click", () => {
    magnet = !magnet;
    btnMagnet.classList.toggle("on-draw", magnet);
    btnMagnet.setAttribute("aria-pressed", String(magnet));
  });

  const btnExtend = document.createElement("button");
  btnExtend.className = "toggle";
  btnExtend.textContent = "↔ 연장";
  btnExtend.title = "그은 추세선을 차트 오른쪽 끝까지 늘립니다";
  btnExtend.setAttribute("aria-pressed", "false");
  btnExtend.addEventListener("click", () => {
    extendMode = !extendMode;
    btnExtend.classList.toggle("on-draw", extendMode);
    btnExtend.setAttribute("aria-pressed", String(extendMode));
    userTrends.forEach(renderTrend);
    drawHandles();
  });

  const btnErase = document.createElement("button");
  btnErase.className = "toggle";
  btnErase.textContent = "지우기";
  btnErase.title = "직접 그은 선을 모두 삭제합니다 (개별 삭제는 핸들 더블클릭)";
  btnErase.addEventListener("click", clearUserLines);

  grpDraw.appendChild(btnDrawT);
  grpDraw.appendChild(btnDrawH);
  grpDraw.appendChild(btnMagnet);
  grpDraw.appendChild(btnExtend);
  grpDraw.appendChild(btnErase);

  // ── 좌표 → 캔들 지점 변환 (useMagnet=true면 고가/저가/시가/종가에 스냅) ──
  function ptAt(x, y, useMagnet) {
    if (!barsArr.length) return null;
    const logical = chart.timeScale().coordinateToLogical(x);
    if (logical == null) return null;
    const idx = Math.max(0, Math.min(barsArr.length - 1, Math.round(logical)));
    const bar = barsArr[idx];
    const raw = candles.coordinateToPrice(y);
    if (raw == null) return null;
    if (!useMagnet) return { time: bar.time, idx, price: raw };
    let best = null, bestD = Infinity;
    for (const p of [bar.high, bar.low, bar.open, bar.close]) {
      const cy = candles.priceToCoordinate(p);
      if (cy == null) continue;
      const d = Math.abs(cy - y);
      if (d < bestD) { bestD = d; best = p; }
    }
    const ok = best != null && bestD <= SNAP_PX;
    return { time: bar.time, idx, price: ok ? best : raw };
  }
  const snapAt = (x, y) => ptAt(x, y, magnet);
  function nearestIdx(time) {
    if (!barsArr.length) return 0;
    let lo = 0, hi = barsArr.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (barsArr[m].time < time) lo = m + 1; else hi = m; }
    return lo;
  }

  function trendData(t) {
    const a = t.p1.time <= t.p2.time ? t.p1 : t.p2;
    const b = t.p1.time <= t.p2.time ? t.p2 : t.p1;
    const ai = a.idx ?? nearestIdx(a.time), bi = b.idx ?? nearestIdx(b.time);
    if (!extendMode || bi === ai || !barsArr.length) {
      return [{ time: a.time, value: a.price }, { time: b.time, value: b.price }];
    }
    // 기울기를 유지한 채 마지막 봉까지 연장
    const slope = (b.price - a.price) / (bi - ai);
    const lastIdx = barsArr.length - 1;
    const end = b.price + slope * (lastIdx - bi);
    if (end <= 0 || lastIdx <= bi) {
      return [{ time: a.time, value: a.price }, { time: b.time, value: b.price }];
    }
    return [{ time: a.time, value: a.price }, { time: barsArr[lastIdx].time, value: end }];
  }
  function renderTrend(t) {
    try { t.series.setData(trendData(t)); } catch {}
  }

  function newHorizLine(price) {
    return candles.createPriceLine({
      price, color: "#c084fc", lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid,
      axisLabelVisible: true, title: "내 라인",
    });
  }
  function makeHoriz(price) {
    const item = { price, line: newHorizLine(price) };
    userLines.push(item);
    return item;
  }
  function makeTrend(p1, p2) {
    const s = chart.addLineSeries({
      color: "#c084fc", lineWidth: 2,
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
    });
    const t = { p1, p2, series: s };
    renderTrend(t);
    userTrends.push(t);
    return t;
  }

  function clearPreview() {
    if (previewSeries) { try { chart.removeSeries(previewSeries); } catch {} previewSeries = null; }
  }
  function detachUserLines() {
    userLines.forEach(h => { try { candles.removePriceLine(h.line); } catch {} });
    userTrends.forEach(t => { try { chart.removeSeries(t.series); } catch {} });
    userLines = []; userTrends = [];
    pending = null;
    clearPreview();
  }
  function restoreUserLines(key) {
    detachUserLines();
    const saved = lineStore[key];
    if (saved) {
      (saved.horiz || []).forEach(p => makeHoriz(p));
      (saved.trends || []).forEach(tr => {
        makeTrend(
          { ...tr.p1, idx: nearestIdx(tr.p1.time) },
          { ...tr.p2, idx: nearestIdx(tr.p2.time) }
        );
      });
    }
    drawHandles();
    setDrawHint();
  }
  function clearUserLines() {
    detachUserLines();
    delete lineStore[current.key];
    persist();
    drawHandles();
    setDrawHint();
  }
  function setDrawHint() {
    const el = $("draw-hint");
    if (drawMode === "trend") el.textContent = pending ? "끝점을 클릭하세요" : "시작점을 클릭하세요";
    else if (drawMode === "horiz") el.textContent = "가격 위치를 클릭하세요";
    else if (userTrends.length || userLines.length) el.textContent = "선 위 더블클릭=삭제 · 끌기=이동 · ● 끌기=회전·길이";
    else el.textContent = "";
  }

  // ── 핸들 오버레이 (● 끝점 회전/길이, ■ 가운데 이동, 수평선 이동) ──
  // 성능: DOM을 매 프레임 다시 만들지 않고, 만들어 둔 핸들의 좌표만 갱신한다.
  const svg = $("handles");
  const chartEl = $("chart");
  let handleRefs = [];       // {el, kind, trend?, which?, item?}
  let handlesRaf = 0;

  function startDrag(ev, d) {
    ev.preventDefault(); ev.stopPropagation();
    dragging = d;
    chart.applyOptions({ handleScroll: false, handleScale: false });
    window.addEventListener("pointermove", onDragMove);
    $("draw-hint").textContent =
      d.type === "mid" ? "선 전체를 이동 중… 놓으면 고정됩니다" :
      d.type === "horiz" ? "수평선을 이동 중…" :
      "반대쪽 점을 축으로 회전·길이 조절 중…";
  }
  function deleteTrend(t) {
    try { chart.removeSeries(t.series); } catch {}
    userTrends = userTrends.filter(x => x !== t);
    saveStore(); rebuildHandles(); setDrawHint();
  }
  function deleteHoriz(h) {
    try { candles.removePriceLine(h.line); } catch {}
    userLines = userLines.filter(x => x !== h);
    saveStore(); rebuildHandles(); setDrawHint();
  }

  function mkEl(tag, cls) {
    const e = document.createElementNS(SVGNS, tag);
    e.setAttribute("class", cls);
    return e;
  }

  // 선이 추가·삭제될 때만 호출 (DOM 재구성)
  function rebuildHandles() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    handleRefs = [];

    for (const t of userTrends) {
      // 선 본체: 어느 위치든 더블클릭하면 삭제, 끌면 선 전체 이동
      const hit = mkEl("line", "hitline");
      hit.addEventListener("pointerdown", ev => {
        const rr = chartEl.getBoundingClientRect();
        const pt = ptAt(ev.clientX - rr.left, ev.clientY - rr.top, false);
        if (!pt) return;
        startDrag(ev, { type: "mid", trend: t,
          off1: { idx: (t.p1.idx ?? nearestIdx(t.p1.time)) - pt.idx, price: t.p1.price - pt.price },
          off2: { idx: (t.p2.idx ?? nearestIdx(t.p2.time)) - pt.idx, price: t.p2.price - pt.price } });
      });
      hit.addEventListener("dblclick", ev => { ev.stopPropagation(); deleteTrend(t); });
      svg.appendChild(hit);
      handleRefs.push({ el: hit, kind: "line", trend: t });

      for (const which of ["p1", "p2"]) {
        const c = mkEl("circle", "handle");
        c.setAttribute("r", 6);
        c.addEventListener("pointerdown", ev => startDrag(ev, { type: "end", trend: t, which }));
        c.addEventListener("dblclick", ev => { ev.stopPropagation(); deleteTrend(t); });
        svg.appendChild(c);
        handleRefs.push({ el: c, kind: "end", trend: t, which });
      }
      const r = mkEl("rect", "handle");
      r.setAttribute("width", 10); r.setAttribute("height", 10);
      r.addEventListener("pointerdown", ev => {
        const rr = chartEl.getBoundingClientRect();
        const pt = ptAt(ev.clientX - rr.left, ev.clientY - rr.top, false);
        if (!pt) return;
        startDrag(ev, { type: "mid", trend: t,
          off1: { idx: (t.p1.idx ?? nearestIdx(t.p1.time)) - pt.idx, price: t.p1.price - pt.price },
          off2: { idx: (t.p2.idx ?? nearestIdx(t.p2.time)) - pt.idx, price: t.p2.price - pt.price } });
      });
      r.addEventListener("dblclick", ev => { ev.stopPropagation(); deleteTrend(t); });
      svg.appendChild(r);
      handleRefs.push({ el: r, kind: "mid", trend: t });
    }

    for (const h of userLines) {
      const r = mkEl("rect", "handle");
      r.setAttribute("width", 14); r.setAttribute("height", 10);
      r.setAttribute("rx", 2);
      r.addEventListener("pointerdown", ev => startDrag(ev, { type: "horiz", item: h }));
      r.addEventListener("dblclick", ev => { ev.stopPropagation(); deleteHoriz(h); });
      svg.appendChild(r);
      handleRefs.push({ el: r, kind: "horiz", item: h });
    }
    positionHandles();
  }

  // 위치만 갱신 (DOM 생성 없음)
  function positionHandles() {
    if (!handleRefs.length) return;
    const ts = chart.timeScale();
    const w = chartEl.clientWidth;
    for (const ref of handleRefs) {
      let x = null, y = null;
      if (ref.kind === "line") {
        const t = ref.trend;
        const d = trendData(t);
        const x1 = ts.timeToCoordinate(d[0].time), y1 = candles.priceToCoordinate(d[0].value);
        const x2 = ts.timeToCoordinate(d[1].time), y2 = candles.priceToCoordinate(d[1].value);
        if (x1 != null && y1 != null && x2 != null && y2 != null) {
          ref.el.setAttribute("x1", x1); ref.el.setAttribute("y1", y1);
          ref.el.setAttribute("x2", x2); ref.el.setAttribute("y2", y2);
          x = x1; y = y1;
        }
      } else if (ref.kind === "end") {
        const p = ref.trend[ref.which];
        x = ts.timeToCoordinate(p.time); y = candles.priceToCoordinate(p.price);
        if (x != null && y != null) { ref.el.setAttribute("cx", x); ref.el.setAttribute("cy", y); }
      } else if (ref.kind === "mid") {
        const t = ref.trend;
        const x1 = ts.timeToCoordinate(t.p1.time), y1 = candles.priceToCoordinate(t.p1.price);
        const x2 = ts.timeToCoordinate(t.p2.time), y2 = candles.priceToCoordinate(t.p2.price);
        if (x1 != null && y1 != null && x2 != null && y2 != null) {
          x = (x1 + x2) / 2; y = (y1 + y2) / 2;
          ref.el.setAttribute("x", x - 5); ref.el.setAttribute("y", y - 5);
        }
      } else {
        y = candles.priceToCoordinate(ref.item.price);
        if (y != null) { x = w - 80; ref.el.setAttribute("x", x); ref.el.setAttribute("y", y - 5); }
      }
      ref.el.style.display = (x == null || y == null) ? "none" : "";
    }
  }

  // 프레임당 한 번만 갱신되도록 병합
  function scheduleHandles() {
    if (handlesRaf) return;
    handlesRaf = requestAnimationFrame(() => { handlesRaf = 0; positionHandles(); });
  }
  function drawHandles() { rebuildHandles(); }   // 기존 호출부 호환

  // ── 드래그 처리 (드래그 중에만 리스너 활성, 프레임당 1회 반영) ──
  let dragPos = null, dragRaf = 0;
  function applyDrag() {
    dragRaf = 0;
    if (!dragging || !dragPos) return;
    const { x, y } = dragPos;
    if (dragging.type === "end") {
      const pt = snapAt(x, y);
      if (!pt) return;
      const cur = dragging.trend[dragging.which];
      if (cur.time === pt.time && cur.price === pt.price) return;  // 변화 없으면 건너뜀
      dragging.trend[dragging.which] = pt;
      renderTrend(dragging.trend);
    } else if (dragging.type === "mid") {
      const pt = ptAt(x, y, false);
      if (!pt) return;
      const t = dragging.trend, n = barsArr.length - 1;
      for (const [k, off] of [["p1", dragging.off1], ["p2", dragging.off2]]) {
        const idx = Math.max(0, Math.min(n, pt.idx + off.idx));
        t[k] = { idx, time: barsArr[idx].time, price: pt.price + off.price };
      }
      renderTrend(t);
    } else if (dragging.type === "horiz") {
      const p = candles.coordinateToPrice(y);
      if (p == null) return;
      dragging.item.price = p;
      // 선을 지웠다 다시 만들지 않고 가격만 갱신 (부하의 주원인이었음)
      try { dragging.item.line.applyOptions({ price: p }); } catch {}
    }
    positionHandles();
  }
  function onDragMove(ev) {
    if (!dragging) return;
    ev.preventDefault();
    const r = chartEl.getBoundingClientRect();
    dragPos = { x: ev.clientX - r.left, y: ev.clientY - r.top };
    if (!dragRaf) dragRaf = requestAnimationFrame(applyDrag);
  }
  window.addEventListener("pointerup", () => {
    if (!dragging) return;
    window.removeEventListener("pointermove", onDragMove);
    if (dragRaf) { cancelAnimationFrame(dragRaf); dragRaf = 0; }
    dragging = null; dragPos = null;
    chart.applyOptions({ handleScroll: true, handleScale: true });
    saveStore();
    setDrawHint();
  });

  // 차트 이동·확대 시 핸들 위치 동기화
  chart.timeScale().subscribeVisibleLogicalRangeChange(() => scheduleHandles());

  // ── 그리는 중 미리보기 (프레임당 1회) ──
  let previewRaf = 0, previewPt = null;
  chart.subscribeCrosshairMove(param => {
    if (drawMode !== "trend" || !pending || !param.point) return;
    const pt = snapAt(param.point.x, param.point.y);
    if (!pt || pt.time === pending.time) return;
    previewPt = pt;
    if (previewRaf) return;
    previewRaf = requestAnimationFrame(() => {
      previewRaf = 0;
      if (!pending || !previewPt) return;
      if (!previewSeries) {
        previewSeries = chart.addLineSeries({
          color: "rgba(192,132,252,.6)", lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dotted,
          priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
        });
      }
      const pts = [pending, previewPt].sort((a, b) => a.time - b.time)
        .map(p => ({ time: p.time, value: p.price }));
      try { previewSeries.setData(pts); } catch {}
    });
  });

  chart.subscribeClick(param => {
    if (!drawMode || !param.point) return;
    const pt = snapAt(param.point.x, param.point.y);
    if (!pt) return;

    if (drawMode === "horiz") {
      makeHoriz(pt.price);
      saveStore();
      drawHandles();
      drawMode = null;          // 하나 그리면 자동으로 모드 해제 (실수로 계속 생기는 것 방지)
      applyDrawMode();
      return;
    }
    if (!pending) { pending = pt; setDrawHint(); return; }
    if (pt.time === pending.time) return;   // 같은 봉 두 번 클릭 방지

    makeTrend(pending, pt);
    pending = null;
    clearPreview();
    saveStore();
    drawHandles();
    drawMode = null;            // 하나 그리면 자동으로 모드 해제
    applyDrawMode();
  });

  // ── AI 해설 ──
  const sep3 = document.createElement("div");
  sep3.className = "sep";
  sep3.style.marginLeft = "auto";
  tools.appendChild(sep3);
  const btnAI = document.createElement("button");
  btnAI.className = "toggle on-ai";
  btnAI.textContent = "AI 해설";
  btnAI.addEventListener("click", showCommentary);
  tools.appendChild(btnAI);

  function fmtSlope(t) {
    return t.slope > 0 ? "우상향" : "우하향";
  }
  function buildLocalCommentary() {
    if (!lastAnalysis) return "분석 데이터가 아직 없습니다. 차트가 로드된 뒤 다시 눌러주세요.";
    const { price, sup, res, trends, bars } = lastAnalysis;
    const out = [];
    out.push(`현재 ${current.label} 기준 BTC 가격은 ${fmtPrice(price)} 달러입니다.`);
    if (bars.length >= 10) {
      const ago = bars[Math.max(0, bars.length - 10)].close;
      const chg = ((price - ago) / ago * 100).toFixed(1);
      out.push(`최근 10개 봉 동안 ${chg >= 0 ? "+" : ""}${chg}% ${chg >= 0 ? "상승" : "하락"}했습니다.`);
    }
    if (sup) {
      const d = ((price - sup.price) / price * 100).toFixed(1);
      out.push(`가장 가까운 지지선은 ${fmtPrice(sup.price)} (현재가 대비 -${d}%, ${sup.touches}회 확인)으로, 이 구간이 지켜지는지가 단기 방어선입니다.`);
    }
    if (res) {
      const d = ((res.price - price) / price * 100).toFixed(1);
      out.push(`가장 가까운 저항선은 ${fmtPrice(res.price)} (+${d}%, ${res.touches}회 확인)이며, 돌파 시 다음 구간까지 열릴 수 있습니다.`);
    }
    for (const t of trends) {
      out.push(`${t.kind}은 ${fmtSlope(t)} 기울기로 ${t.touches}개 스윙 포인트를 지지받고 있습니다.`);
    }
    if (sup && res) {
      const room = ((res.price - price) / (price - sup.price)).toFixed(1);
      out.push(`현재 위치는 지지-저항 사이 구간으로, 위쪽 여유 공간이 아래쪽의 약 ${room}배입니다.`);
    }
    out.push("※ 자동 계산된 참고 자료이며 투자 판단의 책임은 본인에게 있습니다.");
    return out.join(" ");
  }

  async function showCommentary() {
    const panel = $("ai-panel");
    const body = $("ai-body");
    panel.style.display = "block";
    body.textContent = "해설을 생성하는 중…";
    const local = buildLocalCommentary();
    // Claude API 사용 가능 환경(Claude 아티팩트)에서는 AI 해설, 아니면 규칙 기반 요약
    try {
      const ctx = lastAnalysis ? {
        시간봉: current.label,
        현재가: lastAnalysis.price,
        지지선: lastAnalysis.sup,
        저항선: lastAnalysis.res,
        추세선: lastAnalysis.trends,
        최근봉: lastAnalysis.bars.map(b => ({ t: b.time, c: b.close })),
      } : null;
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: "다음은 비트코인 차트 자동 분석 결과입니다. 한국어로 5~7문장의 간결한 기술적 해설을 작성하세요. 지지/저항 위치와 추세선의 의미, 주목할 가격대를 설명하되 매수/매도 지시는 하지 말고, 마지막에 투자 판단은 본인 책임이라는 한 문장을 붙이세요. 데이터: " + JSON.stringify(ctx),
          }],
        }),
        signal: AbortSignal.timeout(20000),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
      if (!text) throw new Error("빈 응답");
      $("ai-src").textContent = "Claude 분석";
      body.textContent = text;
    } catch {
      $("ai-src").textContent = "규칙 기반 요약 (Claude API 미연결 환경)";
      body.textContent = local;
    }
  }

  const conn = document.createElement("div");
  conn.className = "conn";
  conn.innerHTML = '<span class="dot" id="conn-dot"></span><span id="conn-txt">연결 대기</span>';
  nav.appendChild(conn);

  function setConn(state, msg) {
    const d = $("conn-dot");
    d.className = "dot" + (state === "live" ? " live" : state === "err" ? " err" : "");
    $("conn-txt").textContent = msg;
  }
  function showBanner(msg, retryTf) {
    const b = $("banner");
    b.textContent = msg + " ";
    if (retryTf) {
      const r = document.createElement("button");
      r.textContent = "다시 시도";
      r.style.cssText = "margin-left:6px;background:rgba(239,68,68,.25);border:1px solid rgba(239,68,68,.5);color:#fecaca;font-size:12px;padding:3px 10px;border-radius:5px;cursor:pointer;font-family:inherit";
      r.addEventListener("click", () => loadTimeframe(retryTf).then(() => connectWS(retryTf)));
      b.appendChild(r);
    }
    b.style.display = "block";
  }
  function hideBanner() { $("banner").style.display = "none"; }

  // ── 데이터 변환 ──
  function klineToBar(k) {
    return {
      time: Math.floor(k[0] / 1000),
      open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5],
    };
  }
  function aggregateYearly(bars) {
    const byYear = new Map();
    for (const b of bars) {
      const y = new Date(b.time * 1000).getUTCFullYear();
      const cur = byYear.get(y);
      if (!cur) {
        byYear.set(y, { time: Math.floor(Date.UTC(y, 0, 1) / 1000),
          open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume, year: y });
      } else {
        cur.high = Math.max(cur.high, b.high);
        cur.low = Math.min(cur.low, b.low);
        cur.close = b.close;
        cur.volume += b.volume;
      }
    }
    return [...byYear.values()].sort((a, b) => a.time - b.time);
  }
  function volColor(bar) {
    return bar.close >= bar.open ? "rgba(239,68,68,.35)" : "rgba(59,130,246,.35)";
  }
  function applyBars(bars) {
    candles.setData(bars.map(({ time, open, high, low, close }) => ({ time, open, high, low, close })));
    volume.setData(bars.map(b => ({ time: b.time, value: b.volume, color: volColor(b) })));
  }
  function upsertBar(bar) {
    candles.update({ time: bar.time, open: bar.open, high: bar.high, low: bar.low, close: bar.close });
    volume.update({ time: bar.time, value: bar.volume, color: volColor(bar) });
  }

  // ── 헤더 갱신 ──
  function updatePrice(p) {
    const el = $("price");
    el.textContent = fmtPrice(p);
    if (lastPrice !== null && p !== lastPrice) {
      el.classList.remove("tick-up", "tick-down");
      void el.offsetWidth;
      el.classList.add(p > lastPrice ? "tick-up" : "tick-down");
    }
    lastPrice = p;
    document.title = `${fmtPrice(p)} · BTC 실시간 차트`;
  }
  function updateTicker(t) {
    // miniTicker: c 현재가, o 24h 시가, h, l, v
    const c = +t.c, o = +t.o;
    const chg = ((c - o) / o) * 100;
    const el = $("chg24");
    el.textContent = (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%";
    el.className = chg >= 0 ? "up" : "down";
    $("high24").textContent = fmtPrice(+t.h);
    $("low24").textContent = fmtPrice(+t.l);
    $("vol24").textContent = fmtVol(+t.v);
    updatePrice(c);
  }
  function stampUpdate() {
    $("last-update").textContent = "최근 갱신 " + new Date().toLocaleTimeString("ko-KR", { hour12: false });
  }

  // ── 시간봉 로드 ──
  async function loadTimeframe(tf) {
    const seq = ++loadSeq;
    $("loading").style.display = "flex";
    hideBanner();
    try {
      const path = `/klines?symbol=BTCUSDT&interval=${tf.interval}&limit=${tf.limit}`;
      let raw = null, lastErr = null;
      for (let n = 0; n < REST_HOSTS.length; n++) {
        const idx = (restIdx + n) % REST_HOSTS.length;
        try {
          const res = await fetch(REST_HOSTS[idx] + path, { signal: AbortSignal.timeout(7000) });
          if (!res.ok) throw new Error("HTTP " + res.status);
          raw = await res.json();
          restIdx = idx;   // 성공한 서버를 기억
          break;
        } catch (e) { lastErr = e; }
      }
      if (!raw) throw lastErr || new Error("모든 서버 접속 실패");
      if (seq !== loadSeq) return; // 이미 다른 탭으로 전환됨

      let bars = raw.map(klineToBar);
      if (tf.aggregateYear) bars = aggregateYearly(bars);

      barMap = new Map(bars.map(b => [tf.aggregateYear ? b.year : b.time, b]));
      chart.applyOptions({ timeScale: { timeVisible: !!tf.intraday, secondsVisible: false } });
      applyBars(bars);
      chart.timeScale().fitContent();

      const last = bars[bars.length - 1];
      if (last) updatePrice(last.close);
      stampUpdate();
      runAnalysis();
      restoreUserLines(tf.key);   // 저장된 사용자 선 복원
    } catch (e) {
      if (seq !== loadSeq) return;
      showBanner("데이터를 불러오지 못했습니다 (" + (e && e.message || e) + "). " +
        "Claude 미리보기 화면에서는 외부 API가 차단될 수 있으니, 파일을 브라우저에서 열거나 GitHub Pages에 배포해 사용해 주세요.", tf);
    } finally {
      if (seq === loadSeq) $("loading").style.display = "none";
    }
  }

  // ── WebSocket ──
  function connectWS(tf) {
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    const streams = `btcusdt@kline_${tf.interval}/btcusdt@miniTicker`;
    setConn("", "연결 중…");
    ws = new WebSocket(WS_HOSTS[wsIdx] + streams);

    ws.onopen = () => { wsRetry = 0; setConn("live", "실시간"); };

    ws.onmessage = ev => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      const stream = msg.stream || "";
      const data = msg.data;
      if (!data) return;

      if (stream.endsWith("miniTicker")) {
        updateTicker(data);
        stampUpdate();
        return;
      }
      if (data.e === "kline") {
        const k = data.k;
        const incoming = {
          time: Math.floor(k.t / 1000),
          open: +k.o, high: +k.h, low: +k.l, close: +k.c, volume: +k.v,
        };
        if (tf.aggregateYear) {
          // 월봉 스트림을 현재 연봉에 병합
          const y = new Date(incoming.time * 1000).getUTCFullYear();
          let bar = barMap.get(y);
          if (!bar) {
            bar = { time: Math.floor(Date.UTC(y, 0, 1) / 1000),
              open: incoming.open, high: incoming.high, low: incoming.low,
              close: incoming.close, volume: incoming.volume, year: y };
            barMap.set(y, bar);
          }
          bar.high = Math.max(bar.high, incoming.high);
          bar.low = Math.min(bar.low, incoming.low);
          bar.close = incoming.close;
          upsertBar(bar);
        } else {
          barMap.set(incoming.time, incoming);
          upsertBar(incoming);
        }
        if (k.x) runAnalysis();   // 봉 마감 시 지지/저항·추세선 재계산
        stampUpdate();
      }
    };

    ws.onclose = () => {
      wsIdx = (wsIdx + 1) % WS_HOSTS.length;   // 다음 예비 서버로 전환
      const delay = Math.min(1000 * 2 ** wsRetry, 15000);
      wsRetry++;
      setConn("err", `재연결 대기 (${Math.round(delay / 1000)}초)`);
      setTimeout(() => { if (ws && ws.readyState === WebSocket.CLOSED) connectWS(current); }, delay);
    };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }

  // ── 탭 전환 ──
  function switchTimeframe(tf) {
    if (tf.key === current.key) return;
    current = tf;
    nav.querySelectorAll("button").forEach(b =>
      b.classList.toggle("active", b.dataset.key === tf.key));
    loadTimeframe(tf).then(() => connectWS(tf));
  }
  $("ai-close").addEventListener("click", () => { $("ai-panel").style.display = "none"; });

  // ── 시작 ──
  loadTimeframe(current).then(() => connectWS(current));
})();
</script>
